name: Refactor AMY frontend paths

on:
  push:
    branches:
      - refactor/amy-qt-frontend-layout
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/amy-qt-frontend-layout
          fetch-depth: 0

      - name: Remove compatibility symlinks and update canonical paths
        run: |
          set -euo pipefail
          ROOT='amysynth_version/qt_frontend'

          # Remove every symlink from the AMY Qt frontend. Canonical files live
          # in code/, gui/, config/, instruments/, music/, tests/, rpi/, docs/.
          find "$ROOT" -type l -print -delete

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('amysynth_version/qt_frontend/code/main.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'APP_DIR = Path(__file__).resolve().parent\n',
              'CODE_DIR = Path(__file__).resolve().parent\n'
              'FRONTEND_DIR = CODE_DIR.parent\n'
              'GUI_DIR = FRONTEND_DIR / "gui"\n'
              'CONFIG_DIR = FRONTEND_DIR / "config"\n'
              'INSTRUMENT_DIR = FRONTEND_DIR / "instruments"\n'
              'MUSIC_DIR = FRONTEND_DIR / "music"\n'
          )

          # Remove the complete legacy Sonic Pi synth-key compatibility map.
          s = re.sub(
              r'\n# Hidden migration only: old user presets created by the Sonic Pi version may\n.*?\nLEGACY_SYNTH_KEY_MAP = \{.*?\n\}\n',
              '\n',
              s,
              count=1,
              flags=re.S,
          )

          s = s.replace(
              '        # Translate old on-disk Sonic Pi preset keys without exposing them\n'
              '        # in the AMY synth catalogue.\n'
              '        selected_key = LEGACY_SYNTH_KEY_MAP.get(\n'
              '            selected_key,\n'
              '            selected_key,\n'
              '        )\n\n',
              ''
          )

          s = s.replace('            APP_DIR / "default_presets"\n',
                        '            INSTRUMENT_DIR / "default_presets"\n')
          s = s.replace('        default=APP_DIR / "amy_config.json",\n',
                        '        default=CONFIG_DIR / "amy_config.json",\n')
          s = s.replace('    defaults = load_defaults(APP_DIR / "defaults.json")\n',
                        '    defaults = load_defaults(CONFIG_DIR / "defaults.json")\n')
          s = s.replace('    chords = load_chords(APP_DIR / "chords.csv")\n',
                        '    chords = load_chords(MUSIC_DIR / "chords.csv")\n')
          s = s.replace('    ) = load_synth_catalog(APP_DIR / "synths.json")\n',
                        '    ) = load_synth_catalog(INSTRUMENT_DIR / "synths.json")\n')
          s = s.replace('    rhythms = load_rhythm_catalog(APP_DIR / "rhythms.json")\n',
                        '    rhythms = load_rhythm_catalog(MUSIC_DIR / "rhythms.json")\n')
          s = s.replace('        APP_DIR / "title.json"\n',
                        '        CONFIG_DIR / "title.json"\n')
          s = s.replace('        APP_DIR / "intonation_eq.json"\n',
                        '        MUSIC_DIR / "intonation_eq.json"\n')
          s = s.replace('        APP_DIR / "intonation_harm.json"\n',
                        '        MUSIC_DIR / "intonation_harm.json"\n')
          s = s.replace('        APP_DIR / "intonation_jv.json"\n',
                        '        MUSIC_DIR / "intonation_jv.json"\n')
          s = s.replace(
              '    # Startup synth selections are controlled by defaults.json.\n'
              '    # Translate legacy Sonic Pi keys if an older defaults.json is copied in,\n'
              '    # and fall back to the catalogue defaults rather than aborting startup.\n',
              '    # Startup synth selections are controlled by defaults.json.\n'
              '    # Unknown keys fall back to the catalogue defaults.\n'
          )
          s = s.replace(
              '        key = LEGACY_SYNTH_KEY_MAP.get(\n'
              '            raw_key,\n'
              '            raw_key,\n'
              '        )\n'
              '        index = synth_index_by_key.get(key)\n',
              '        index = synth_index_by_key.get(raw_key)\n'
          )
          s = s.replace('        QUrl.fromLocalFile(str(APP_DIR / "Main.qml"))\n',
                        '        QUrl.fromLocalFile(str(GUI_DIR / "Main.qml"))\n')

          if 'APP_DIR' in s or 'LEGACY_SYNTH_KEY_MAP' in s:
              raise SystemExit('Unconverted compatibility reference remains in main.py')

          p.write_text(s, encoding='utf-8')

          # Documentation: describe canonical layout, not compatibility links.
          for name in ('README.md', 'README_rpi.md'):
              rp = Path('amysynth_version/qt_frontend') / name
              text = rp.read_text(encoding='utf-8')
              text = text.replace(
                  'The `code/` directory contains the runnable Python files plus compatibility symlinks so the tested APP_DIR-relative paths continue to work.\n',
                  'The application uses the canonical directories directly; there are no compatibility symlinks.\n'
              )
              text = text.replace('compatibility symlinks', 'canonical paths')
              rp.write_text(text, encoding='utf-8')
          PY

          # Sanity checks: no symlinks, and all canonical runtime inputs exist.
          test -z "$(find "$ROOT" -type l -print)"
          for f in \
            code/main.py code/amy_serial.py \
            gui/Main.qml gui/InstrumentWatermarks.qml gui/tuba_watermark.png \
            config/amy_config.json config/defaults.json config/title.json \
            instruments/synths.json instruments/default_presets/p1.json \
            music/chords.csv music/rhythms.json music/intonation_eq.json \
            music/intonation_harm.json music/intonation_jv.json; do
            test -e "$ROOT/$f"
          done

          python3 -m py_compile "$ROOT/code/main.py" "$ROOT/code/amy_serial.py"

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove AMY frontend compatibility symlinks'
          git push origin HEAD:refactor/amy-qt-frontend-layout
