name: AMY frontend regression

on:
  workflow_call:
    inputs:
      run_matrix:
        description: Run the complete parallel suite matrix when called by another workflow
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - 'amysynth_version/qt_frontend/**'
      - '.github/workflows/amy-regression.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Test subset to run
        required: true
        default: unit
        type: choice
        options:
          - unit
          - frontend
          - serial
          - presets
          - native-controls
          - native-rhythm
          - all

permissions:
  contents: read

env:
  AMY_RELEASE_BRANCH: releases/amy_omnichord_R20260831T001253
  AMY_COMMIT: 00157856312de89f6dc293f90efb1889f0ceff23

# A feature branch can receive several quick follow-up commits while a hardware
# regression is being fixed. Do not finish six obsolete jobs for every older
# PR head; keep only the newest run for that PR/ref. Manual runs use their own
# ref-scoped group and similarly supersede an older manual run for that ref.
concurrency:
  group: amy-regression-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  regression-matrix:
    if: github.event_name != 'workflow_dispatch' || inputs.run_matrix
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - frontend
          - serial
          - presets
          - native-controls
          - native-rhythm

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements.txt

      - name: Install frontend dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -r requirements.txt

      - name: Install pinned LB Omnichord AMY
        if: startsWith(matrix.suite, 'native-')
        run: |
          git clone https://github.com/linuxificator/amy.git /tmp/amy-lb
          git -C /tmp/amy-lb merge-base --is-ancestor \
            "$AMY_COMMIT" "origin/$AMY_RELEASE_BRANCH"
          git -C /tmp/amy-lb checkout "$AMY_COMMIT"
          test "$(git -C /tmp/amy-lb rev-parse HEAD)" = "$AMY_COMMIT"
          AMY_PCM_BANK=gamma9001 python -m pip install /tmp/amy-lb
          amy_so="$(python -c 'import c_amy; print(c_amy.__file__)')"
          nm -D "$amy_so" | grep 'amy_set_gamma9001_pcm' >/dev/null
          nm -D "$amy_so" | grep 'gamma9001_pcm_data' >/dev/null
          mkdir -p amysynth_version/qt_frontend/test-artifacts/${{ matrix.suite }}
          git -C /tmp/amy-lb rev-parse HEAD \
            > amysynth_version/qt_frontend/test-artifacts/${{ matrix.suite }}/amy_commit.txt
          python - <<'PY' > amysynth_version/qt_frontend/test-artifacts/${{ matrix.suite }}/amy_version.txt
          import amy
          print(getattr(amy, '__version__', 'unknown'))
          print('sample_rate', amy.AMY_SAMPLE_RATE)
          print('block_size', amy.AMY_BLOCK_SIZE)
          PY

      - name: Run selected regression suite
        working-directory: amysynth_version/qt_frontend
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/amysynth_version/qt_frontend/tests/alsa-null.conf
          OMNICHORD_TEST_ARTIFACT_DIR: test-artifacts
        run: python tests/run_tests.py --suite '${{ matrix.suite }}'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amy-regression-${{ matrix.suite }}
          path: amysynth_version/qt_frontend/test-artifacts/${{ matrix.suite }}
          if-no-files-found: ignore
          retention-days: 14

  manual:
    if: github.event_name == 'workflow_dispatch' && !inputs.run_matrix
    name: manual-${{ inputs.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements.txt

      - name: Install frontend dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -r requirements.txt

      - name: Install pinned LB Omnichord AMY when required
        if: inputs.suite == 'all' || startsWith(inputs.suite, 'native-')
        run: |
          git clone https://github.com/linuxificator/amy.git /tmp/amy-lb
          git -C /tmp/amy-lb merge-base --is-ancestor \
            "$AMY_COMMIT" "origin/$AMY_RELEASE_BRANCH"
          git -C /tmp/amy-lb checkout "$AMY_COMMIT"
          test "$(git -C /tmp/amy-lb rev-parse HEAD)" = "$AMY_COMMIT"
          AMY_PCM_BANK=gamma9001 python -m pip install /tmp/amy-lb
          amy_so="$(python -c 'import c_amy; print(c_amy.__file__)')"
          nm -D "$amy_so" | grep 'amy_set_gamma9001_pcm' >/dev/null
          nm -D "$amy_so" | grep 'gamma9001_pcm_data' >/dev/null
          mkdir -p amysynth_version/qt_frontend/test-artifacts/${{ inputs.suite }}
          git -C /tmp/amy-lb rev-parse HEAD \
            > amysynth_version/qt_frontend/test-artifacts/${{ inputs.suite }}/amy_commit.txt
          python - <<'PY' > amysynth_version/qt_frontend/test-artifacts/${{ inputs.suite }}/amy_version.txt
          import amy
          print(getattr(amy, '__version__', 'unknown'))
          print('sample_rate', amy.AMY_SAMPLE_RATE)
          print('block_size', amy.AMY_BLOCK_SIZE)
          PY

      - name: Run requested regression suite
        working-directory: amysynth_version/qt_frontend
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/amysynth_version/qt_frontend/tests/alsa-null.conf
          OMNICHORD_TEST_ARTIFACT_DIR: test-artifacts
        run: python tests/run_tests.py --suite '${{ inputs.suite }}'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amy-regression-manual-${{ inputs.suite }}
          path: amysynth_version/qt_frontend/test-artifacts
          if-no-files-found: ignore
          retention-days: 14
