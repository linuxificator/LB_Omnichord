name: AMY frontend regression

on:
  workflow_call:
    inputs:
      suite:
        description: Test subset to run, or matrix for the full CI matrix
        required: false
        default: matrix
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'amysynth_version/qt_frontend/**'
      - 'amysynth_version/design/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.github/workflows/amy-regression.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Test subset to run
        required: true
        default: unit
        type: choice
        options:
          - quality
          - unit
          - frontend
          - serial
          - presets
          - native-controls
          - native-rhythm
          - all

permissions:
  contents: read

# A feature branch can receive several quick follow-up commits while a hardware
# regression is being fixed. Do not finish six obsolete jobs for every older
# PR head; keep only the newest run for that PR/ref. Manual runs use their own
# ref-scoped group and similarly supersede an older manual run for that ref.
concurrency:
  group: amy-regression-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  regression-matrix:
    if: inputs.suite == '' || inputs.suite == 'matrix'
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - quality
          - unit
          - frontend
          - serial
          - presets
          - native-controls
          - native-rhythm

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            amysynth_version/qt_frontend/requirements.txt
            amysynth_version/qt_frontend/requirements-portable.txt
            amysynth_version/qt_frontend/requirements-test.txt
            amysynth_version/qt_frontend/packaging/constraints/desktop-current.txt

      - name: Load exact release inputs
        run: >-
          python amysynth_version/qt_frontend/packaging/release_inputs.py
          github-env --output "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -c packaging/constraints/desktop-current.txt -r requirements-test.txt

      - name: Install pinned LB Omnichord AMY
        if: startsWith(matrix.suite, 'native-')
        run: |
          python amysynth_version/qt_frontend/packaging/checkout_amy.py \
            --destination /tmp/amy-lb
          AMY_PCM_BANK="$AMY_PCM_BANK" python -m pip install /tmp/amy-lb
          mkdir -p amysynth_version/qt_frontend/test-artifacts/${{ matrix.suite }}
          git -C /tmp/amy-lb rev-parse HEAD \
            > amysynth_version/qt_frontend/test-artifacts/${{ matrix.suite }}/amy_commit.txt
          python - <<'PY' > amysynth_version/qt_frontend/test-artifacts/${{ matrix.suite }}/amy_version.txt
          import amy
          print(getattr(amy, '__version__', 'unknown'))
          print('sample_rate', amy.AMY_SAMPLE_RATE)
          print('block_size', amy.AMY_BLOCK_SIZE)
          PY

      - name: Run selected regression suite
        working-directory: amysynth_version/qt_frontend
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/amysynth_version/qt_frontend/tests/alsa-null.conf
          OMNICHORD_TEST_ARTIFACT_DIR: test-artifacts
        run: |
          coverage_args=()
          if [[ '${{ matrix.suite }}' == 'unit' ]]; then
            coverage_args+=(--coverage)
          fi
          python tests/run_tests.py --suite '${{ matrix.suite }}' "${coverage_args[@]}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amy-regression-${{ matrix.suite }}
          path: |
            amysynth_version/qt_frontend/test-artifacts/${{ matrix.suite }}
            amysynth_version/qt_frontend/test-artifacts/test-report-${{ matrix.suite }}.json
            amysynth_version/qt_frontend/test-artifacts/coverage-${{ matrix.suite }}
          if-no-files-found: ignore
          retention-days: 14

  manual:
    if: inputs.suite != '' && inputs.suite != 'matrix'
    name: manual-${{ inputs.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            amysynth_version/qt_frontend/requirements.txt
            amysynth_version/qt_frontend/requirements-portable.txt
            amysynth_version/qt_frontend/requirements-test.txt
            amysynth_version/qt_frontend/packaging/constraints/desktop-current.txt

      - name: Load exact release inputs
        run: >-
          python amysynth_version/qt_frontend/packaging/release_inputs.py
          github-env --output "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -c packaging/constraints/desktop-current.txt -r requirements-test.txt

      - name: Install pinned LB Omnichord AMY when required
        if: inputs.suite == 'all' || startsWith(inputs.suite, 'native-')
        run: |
          python amysynth_version/qt_frontend/packaging/checkout_amy.py \
            --destination /tmp/amy-lb
          AMY_PCM_BANK="$AMY_PCM_BANK" python -m pip install /tmp/amy-lb
          mkdir -p amysynth_version/qt_frontend/test-artifacts/${{ inputs.suite }}
          git -C /tmp/amy-lb rev-parse HEAD \
            > amysynth_version/qt_frontend/test-artifacts/${{ inputs.suite }}/amy_commit.txt
          python - <<'PY' > amysynth_version/qt_frontend/test-artifacts/${{ inputs.suite }}/amy_version.txt
          import amy
          print(getattr(amy, '__version__', 'unknown'))
          print('sample_rate', amy.AMY_SAMPLE_RATE)
          print('block_size', amy.AMY_BLOCK_SIZE)
          PY

      - name: Run requested regression suite
        working-directory: amysynth_version/qt_frontend
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/amysynth_version/qt_frontend/tests/alsa-null.conf
          OMNICHORD_TEST_ARTIFACT_DIR: test-artifacts
        run: |
          coverage_args=()
          if [[ '${{ inputs.suite }}' == 'unit' ]]; then
            coverage_args+=(--coverage)
          fi
          python tests/run_tests.py --suite '${{ inputs.suite }}' "${coverage_args[@]}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amy-regression-manual-${{ inputs.suite }}
          path: amysynth_version/qt_frontend/test-artifacts
          if-no-files-found: ignore
          retention-days: 14
