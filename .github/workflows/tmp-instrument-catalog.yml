name: Temporary instrument settings validation

on:
  pull_request:
    paths:
      - 'amysynth_version/qt_frontend/code/main.py'
      - 'amysynth_version/qt_frontend/instruments/**'
      - 'amysynth_version/qt_frontend/tests/test_instrument_defaults.py'
      - '.github/workflows/tmp-instrument-catalog.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instrument-control-defaults

      - name: Install minimal PySide runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements.txt

      - name: Install frontend dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -r requirements.txt

      - name: Run instrument state tests
        working-directory: amysynth_version/qt_frontend
        run: python tests/test_instrument_defaults.py

      - name: Verify defaults are reproducible from upstream AMY table
        run: |
          curl -fsSL https://raw.githubusercontent.com/shorepine/amy/main/src/patches.h -o /tmp/amy-patches.h
          python3 amysynth_version/qt_frontend/instruments/generate_defaults.py \
            /tmp/amy-patches.h \
            amysynth_version/qt_frontend/instruments/synths.json
          git diff --exit-code -- amysynth_version/qt_frontend/instruments/synths.json
