name: Temporary reverb and safety refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/reverb-reset-and-control-safety'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reverb-reset-and-control-safety
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply atomic chord-hold path and regressions
        run: python tools/tmp_batch_chord_hold_and_tests.py
      - name: Syntax checks
        run: |
          python -m py_compile \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/code/main.py \
            amysynth_version/qt_frontend/tests/integration/harness.py \
            amysynth_version/qt_frontend/tests/integration/test_serial.py \
            amysynth_version/qt_frontend/tests/integration/test_native_controls.py \
            amysynth_version/qt_frontend/tests/test_static_contracts.py
          git diff --check
      - name: Commit regressions and fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/code/main.py \
            amysynth_version/qt_frontend/tests/integration/harness.py \
            amysynth_version/qt_frontend/tests/integration/test_serial.py \
            amysynth_version/qt_frontend/tests/integration/test_native_controls.py \
            amysynth_version/qt_frontend/tests/test_static_contracts.py
          git diff --cached --check
          git commit -m 'Make manual chord hold a single rhythm transaction'
          git push origin HEAD:feature/reverb-reset-and-control-safety
