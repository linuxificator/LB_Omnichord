name: Temporary reverb and safety refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/reverb-reset-and-control-safety'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reverb-reset-and-control-safety
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix helper duplicate-LFO assertion and apply refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/tmp_apply_reverb_reset.py')
          text = p.read_text()
          old = '''replace_once(amy_serial, "                    f\\\"v1f{self._f(max(0.01, min(20.0, lfo_hz)))}i{synth}Z\\\"\\n", "                    f\\\"v1f{self._f(clamp_control_value('lfo_hz', lfo_hz))}i{synth}Z\\\"\\n")\n# There are two identical lfo clamp snippets; replace second if still present.\ntext = amy_serial.read_text(encoding="utf-8")\ntext = text.replace("f\\\"v1f{self._f(max(0.01, min(20.0, lfo_hz)))}i{synth}Z\\\"", "f\\\"v1f{self._f(clamp_control_value('lfo_hz', lfo_hz))}i{synth}Z\\\"")\n'''
          new = '''text = amy_serial.read_text(encoding="utf-8")\nlfo_old = "f\\\"v1f{self._f(max(0.01, min(20.0, lfo_hz)))}i{synth}Z\\\""\nif text.count(lfo_old) != 2:\n    raise RuntimeError(f"expected two LFO clamp sites, found {text.count(lfo_old)}")\ntext = text.replace(lfo_old, "f\\\"v1f{self._f(clamp_control_value('lfo_hz', lfo_hz))}i{synth}Z\\\"")\n'''
          if old not in text:
              raise SystemExit('temporary helper patch target missing')
          p.write_text(text.replace(old, new, 1))
          PY
          python tools/tmp_apply_reverb_reset.py
      - name: Syntax and JSON checks
        run: |
          python -m py_compile \
            amysynth_version/qt_frontend/code/control_limits.py \
            amysynth_version/qt_frontend/code/synth_state.py \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/code/main.py \
            amysynth_version/qt_frontend/tests/integration/headless_app.py
          python -m json.tool amysynth_version/qt_frontend/instruments/synths.json >/dev/null
          python -m json.tool amysynth_version/qt_frontend/config/defaults.json >/dev/null
          python -m json.tool amysynth_version/qt_frontend/config/amy_config.json >/dev/null
      - name: Commit generated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            amysynth_version/qt_frontend/code/control_limits.py \
            amysynth_version/qt_frontend/code/synth_state.py \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/code/main.py \
            amysynth_version/qt_frontend/tests/integration/headless_app.py \
            amysynth_version/qt_frontend/config/defaults.json \
            amysynth_version/qt_frontend/config/amy_config.json \
            amysynth_version/qt_frontend/instruments/synths.json \
            amysynth_version/qt_frontend/gui/Main.qml \
            amysynth_version/qt_frontend/gui/PresetResetButton.qml
          git diff --cached --check
          git commit -m 'Add safe synth controls and preset-aware reverb resets'
          git push origin HEAD:feature/reverb-reset-and-control-safety
