name: Temporary slider parameter fix validation

on:
  pull_request:
    paths:
      - 'amysynth_version/qt_frontend/code/amy_serial.py'
      - 'amysynth_version/qt_frontend/gui/ParameterSlider.qml'
      - 'amysynth_version/qt_frontend/instruments/**'
      - 'amysynth_version/qt_frontend/tests/test_instrument_defaults.py'
      - '.github/workflows/tmp-slider-parameter-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instrument-control-defaults

      - name: Patch AMY incremental parameter handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('amysynth_version/qt_frontend/code/amy_serial.py')
          s = p.read_text(encoding='utf-8')

          old = '''    def _param_commands_for_synth(\n        self,\n        role: str,\n        synth: int,\n    ) -> list[str]:\n'''
          new = '''    def _param_commands_for_synth(\n        self,\n        role: str,\n        synth: int,\n        parameter_keys: set[str] | None = None,\n    ) -> list[str]:\n'''
          if old not in s:
              raise SystemExit('parameter command signature anchor missing')
          s = s.replace(old, new, 1)

          old = '''        Negative slider values mean "leave the factory patch value alone".\n        Juno: osc0 is VCF/VCA gather, osc1 is the LFO, osc2 pulse,\n'''
          new = '''        Missing controls leave the current patch value alone.  Negative values\n        are accepted only as a legacy "unset" sentinel and are never exposed\n        by the current UI.  When parameter_keys is provided, emit commands\n        only for those controls so moving one slider cannot resend unrelated\n        filter/LFO/envelope settings.\n\n        Juno: osc0 is VCF/VCA gather, osc1 is the LFO, osc2 pulse,\n'''
          if old not in s:
              raise SystemExit('parameter command doc anchor missing')
          s = s.replace(old, new, 1)

          old = '''        def nonneg(name: str) -> float | None:\n            value = params.get(name)\n            if value is None or value < 0:\n                return None\n            return float(value)\n'''
          new = '''        def nonneg(name: str) -> float | None:\n            if parameter_keys is not None and name not in parameter_keys:\n                return None\n            value = params.get(name)\n            if value is None or value < 0:\n                return None\n            return float(value)\n'''
          if old not in s:
              raise SystemExit('nonneg anchor missing')
          s = s.replace(old, new, 1)

          old = '''            # This is a global ALGO-output ADSR layered on top of the DX7\n            # operators' native envelopes.  The native operator envelopes are\n            # intentionally left intact.\n            attack = nonneg("attack_ms")\n            decay = nonneg("decay_ms")\n            sustain = nonneg("sustain")\n            release = nonneg("release_ms")\n            if any(v is not None for v in (attack, decay, sustain, release)):\n                a = 0.0 if attack is None else max(0.0, attack)\n                d = 0.0 if decay is None else max(0.0, decay)\n                sus = 1.0 if sustain is None else max(0.0, min(1.0, sustain))\n                r = 60000.0 if release is None else max(0.0, release)\n                commands.append(\n                    f"v0a,,,1A{self._f(a)},1,{self._f(d)},{self._f(sus)},"\n                    f"{self._f(r)},0i{synth}Z"\n                )\n'''
          new = '''            # This is a global ALGO-output ADSR layered on top of the DX7\n            # operators' native envelopes.  The native operator envelopes are\n            # intentionally left intact.  If any ADSR member changed, resend\n            # the complete global envelope because it belongs to us rather than\n            # to the factory DX7 operator patch.\n            adsr_keys = {\n                "attack_ms", "decay_ms", "sustain", "release_ms"\n            }\n            if (\n                parameter_keys is None\n                or bool(parameter_keys & adsr_keys)\n            ):\n                def current_nonneg(name: str) -> float | None:\n                    value = params.get(name)\n                    if value is None or value < 0:\n                        return None\n                    return float(value)\n\n                attack = current_nonneg("attack_ms")\n                decay = current_nonneg("decay_ms")\n                sustain = current_nonneg("sustain")\n                release = current_nonneg("release_ms")\n                if any(\n                    v is not None\n                    for v in (attack, decay, sustain, release)\n                ):\n                    a = 0.0 if attack is None else max(0.0, attack)\n                    d = 0.0 if decay is None else max(0.0, decay)\n                    sus = (\n                        1.0\n                        if sustain is None\n                        else max(0.0, min(1.0, sustain))\n                    )\n                    r = 60000.0 if release is None else max(0.0, release)\n                    commands.append(\n                        f"v0a,,,1A{self._f(a)},1,{self._f(d)},{self._f(sus)},"\n                        f"{self._f(r)},0i{synth}Z"\n                    )\n'''
          if old not in s:
              raise SystemExit('DX7 ADSR anchor missing')
          s = s.replace(old, new, 1)

          old = '''    def _apply_supported_params(self, role: str) -> None:\n        for synth in self._role_synth_ids(role):\n            for command in self._param_commands_for_synth(role, synth):\n                self._wire(command)\n'''
          new = '''    def _apply_supported_params(\n        self,\n        role: str,\n        parameter_keys: set[str] | None = None,\n    ) -> None:\n        for synth in self._role_synth_ids(role):\n            for command in self._param_commands_for_synth(\n                role, synth, parameter_keys\n            ):\n                self._wire(command)\n'''
          if old not in s:
              raise SystemExit('apply-supported anchor missing')
          s = s.replace(old, new, 1)

          old = '''        self.selected_synth[role] = name\n        self._configure_synth(role)\n'''
          new = '''        self.selected_synth[role] = name\n\n        # A synth-name message is immediately followed by the complete slider\n        # state from the frontend.  Do not apply the previous instrument's\n        # controls while loading the new factory patch; clear them first, then\n        # let that following parameter message establish the new state.\n        self.synth_params[role] = {}\n        self._adsr_override_active[role] = False\n        self._configure_synth(role)\n'''
          if old not in s:
              raise SystemExit('set-synth-name anchor missing')
          s = s.replace(old, new, 1)

          old = '''    def _set_params(self, role: str, values: Any) -> None:\n        was_active = self._adsr_override_active.get(role, False)\n        self.synth_params[role] = self._params_from_list(values)\n        now_active = self._adsr_is_active(role)\n        self._adsr_override_active[role] = now_active\n\n        if was_active and not now_active:\n            self._configure_synth(role)\n            if role == "chord" and self._manual_active_id is not None:\n                for note in self._manual_active_notes:\n                    self._wire(\n                        f"n{self._f(note)}l1i{self.synth_id['manual_chord']}Z"\n                    )\n            return\n\n        self._apply_supported_params(role)\n'''
          new = '''    def _set_params(self, role: str, values: Any) -> None:\n        old_params = self.synth_params[role]\n        new_params = self._params_from_list(values)\n\n        changed_keys: set[str] = set()\n        for key in set(old_params) | set(new_params):\n            old_value = old_params.get(key)\n            new_value = new_params.get(key)\n            if old_value is None or new_value is None:\n                if old_value != new_value:\n                    changed_keys.add(key)\n                continue\n            if not math.isclose(\n                float(old_value),\n                float(new_value),\n                rel_tol=0.0,\n                abs_tol=1e-12,\n            ):\n                changed_keys.add(key)\n\n        was_active = self._adsr_override_active.get(role, False)\n        self.synth_params[role] = new_params\n        now_active = self._adsr_is_active(role)\n        self._adsr_override_active[role] = now_active\n\n        if was_active and not now_active:\n            self._configure_synth(role)\n            if role == "chord" and self._manual_active_id is not None:\n                for note in self._manual_active_notes:\n                    self._wire(\n                        f"n{self._f(note)}l1i{self.synth_id['manual_chord']}Z"\n                    )\n            return\n\n        if changed_keys:\n            self._apply_supported_params(role, changed_keys)\n'''
          if old not in s:
              raise SystemExit('set-params anchor missing')
          s = s.replace(old, new, 1)

          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Regenerate slider catalogue from latest AMY main
        run: |
          curl -fsSL https://raw.githubusercontent.com/shorepine/amy/main/src/patches.h -o /tmp/amy-patches.h
          python3 amysynth_version/qt_frontend/instruments/generate_defaults.py \
            /tmp/amy-patches.h \
            amysynth_version/qt_frontend/instruments/synths.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements.txt

      - name: Install frontend dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -r requirements.txt

      - name: Run focused tests
        working-directory: amysynth_version/qt_frontend
        run: python tests/test_instrument_defaults.py

      - name: Verify Python syntax
        run: |
          python -m py_compile \
            amysynth_version/qt_frontend/code/main.py \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/instruments/generate_defaults.py

      - name: Commit tested generated changes
        run: |
          if git diff --quiet -- \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/instruments/synths.json; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/instruments/synths.json
          git commit -m 'Isolate slider updates and remove legacy negative ranges'
          git push origin HEAD:feature/instrument-control-defaults
