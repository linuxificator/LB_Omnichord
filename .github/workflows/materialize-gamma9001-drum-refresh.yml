name: Materialize Gamma9001 drum refresh

on:
  push:
    branches:
      - feature/gamma9001-drum-pattern-refresh
    paths:
      - '.github/workflows/materialize-gamma9001-drum-refresh.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/gamma9001-drum-pattern-refresh
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify and materialize reviewed payload
        run: |
          python amysynth_version/design/rhythm_rework/new_patterns/materialize_gamma9001_drum_refresh.py --check
          python amysynth_version/design/rhythm_rework/new_patterns/materialize_gamma9001_drum_refresh.py

      - name: Preserve current rhythm metadata and two-bar cycles
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from copy import deepcopy
          from pathlib import Path

          rel = 'amysynth_version/qt_frontend/music/drums/drum_activity_timing.json'
          activity_path = Path(rel)
          manifest_path = Path('amysynth_version/design/rhythm_rework/new_patterns/canonical_drum_data_manifest.json')
          provenance_path = Path('amysynth_version/qt_frontend/music/catalogue_provenance.json')

          activity = json.loads(activity_path.read_text(encoding='utf-8'))
          base = json.loads(subprocess.check_output(['git', 'show', f'origin/main:{rel}'], text=True))
          current = {item['id']: item for item in activity['rhythms']}
          baseline = {item['id']: item for item in base['rhythms']}
          if set(current) != set(baseline):
              raise SystemExit('refresh rhythm IDs differ from main')

          fields = ('meter', 'period_bars', 'period_ticks')
          differences = {
              rhythm_id: {
                  field: (current[rhythm_id][field], baseline[rhythm_id][field])
                  for field in fields
                  if current[rhythm_id][field] != baseline[rhythm_id][field]
              }
              for rhythm_id in current
          }
          differences = {key: value for key, value in differences.items() if value}
          expected = {
              'disco', 'eleven_eight', 'five_four', 'house', 'nine_eight',
              'samba', 'seven_eight', 'seven_four_funk', 'techno', 'trance',
          }
          print('RHYTHM_METADATA_DIFFERENCES', json.dumps(differences, sort_keys=True))
          if set(differences) != expected:
              raise SystemExit(
                  f'unexpected metadata-difference set: got {sorted(differences)}, '
                  f'expected {sorted(expected)}'
              )

          for rhythm_id, rhythm in current.items():
              base_rhythm = baseline[rhythm_id]
              old_period = int(rhythm['period_ticks'])
              new_period = int(base_rhythm['period_ticks'])
              if rhythm_id in differences:
                  if new_period != old_period * 2:
                      raise SystemExit(
                          f'{rhythm_id}: cannot safely expand period {old_period} -> {new_period}'
                      )
                  for level in rhythm['levels']:
                      original_events = deepcopy(level['events'])
                      repeated = [
                          {**event, 'tick': int(event['tick']) + old_period}
                          for event in original_events
                      ]
                      level['events'] = original_events + repeated
                      level['events'].sort(key=lambda event: (int(event['tick']), str(event['role'])))
                      level['event_count'] = len(level['events'])
                      if level['event_count'] > 56:
                          raise SystemExit(
                              f'{rhythm_id} level {level["level"]}: '
                              f'{level["event_count"]} events after cycle preservation exceeds 56'
                          )
              for field in fields:
                  rhythm[field] = base_rhythm[field]
              if any(
                  int(event['tick']) >= int(rhythm['period_ticks'])
                  for level in rhythm['levels']
                  for event in level['events']
              ):
                  raise SystemExit(f'{rhythm_id}: event outside restored period')

          level_locations = [
              (rhythm['id'], int(level['level']), len(level['events']))
              for rhythm in activity['rhythms']
              for level in rhythm['levels']
          ]
          maximum = max(count for _, _, count in level_locations)
          activity['coverage_summary'] = {
              'rhythm_count': len(activity['rhythms']),
              'levels_per_rhythm': 5,
              'max_event_count': maximum,
              'max_event_locations': [
                  {'rhythm_id': rhythm_id, 'level': level, 'event_count': count}
                  for rhythm_id, level, count in level_locations
                  if count == maximum
              ],
          }
          activity['repository_contract']['branch'] = 'feature/gamma9001-drum-pattern-refresh'
          activity['repository_contract']['commit_read'] = subprocess.check_output(
              ['git', 'rev-parse', 'origin/main'], text=True
          ).strip()
          activity['repository_contract']['design_status'] = (
              'canonical runtime activity catalogue; Gamma9001 quality refresh 2026-09-05'
          )

          encoded = (json.dumps(activity, indent=2) + '\n').encode('utf-8')
          canonical_sha = hashlib.sha256(encoded).hexdigest()
          activity_path.write_bytes(encoded)

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for entry in manifest['files']:
              if entry['name'] == 'drum_activity_timing.json':
                  entry['sha256'] = canonical_sha
                  break
          else:
              raise SystemExit('manifest lacks drum_activity_timing.json')
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          provenance = json.loads(provenance_path.read_text(encoding='utf-8'))
          provenance['recorded'] = '2026-09-05'
          for entry in provenance['catalogues']:
              if entry['path'] == 'music/drums/drum_activity_timing.json':
                  entry['sha256'] = canonical_sha
                  entry['process'] = (
                      'LB-authored 2026-09-05 genre-convention refresh; Gamma9001 is the musical '
                      'reference while timing remains kit-independent; pre-refresh rhythm meter and '
                      'cycle-length metadata retained exactly, with authored one-cycle grooves repeated '
                      'across the existing two-cycle period where required'
                  )
                  break
          else:
              raise SystemExit('provenance lacks drum activity entry')
          provenance_path.write_text(json.dumps(provenance, indent=2) + '\n', encoding='utf-8')
          print('CANONICAL_DRUM_ACTIVITY_SHA256', canonical_sha)
          print('MAX_EVENT_COUNT', maximum)
          print('EXPANDED', ','.join(sorted(differences)))
          PY

      - name: Add foundation richness regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('amysynth_version/qt_frontend/tests/test_drum_patterns.py')
          text = p.read_text(encoding='utf-8')
          method = '''    def test_foundation_levels_are_musically_usable(self) -> None:\n        for rhythm in self.catalog.rhythms.values():\n            foundation = rhythm.levels[0]\n            self.assertGreaterEqual(len(foundation), 5, rhythm.rhythm_id)\n            self.assertGreaterEqual(\n                len({event.role for event in foundation}),\n                2,\n                rhythm.rhythm_id,\n            )\n\n'''
          marker = '    def test_activity_levels_are_selected_complete_not_concatenated(self) -> None:\n'
          if 'def test_foundation_levels_are_musically_usable' not in text:
              if marker not in text:
                  raise SystemExit('test insertion marker not found')
              p.write_text(text.replace(marker, method + marker, 1), encoding='utf-8')
          PY

      - name: Install frontend test dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -r requirements-test.txt

      - name: Run targeted drum and provenance tests
        working-directory: amysynth_version/qt_frontend
        run: |
          python tests/test_drum_patterns.py
          python tests/test_catalogue_provenance.py

      - name: Run maintained unit suite
        working-directory: amysynth_version/qt_frontend
        run: python tests/run_tests.py --suite unit

      - name: Record completion status
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          activity = Path('amysynth_version/qt_frontend/music/drums/drum_activity_timing.json')
          sha = hashlib.sha256(activity.read_bytes()).hexdigest()
          p = Path('amysynth_version/design/rhythm_rework/new_patterns/CODEX_HANDOVER_GAMMA9001_DRUM_PATTERN_REFRESH.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Status: **data authored and validated; materialization into the canonical runtime JSON is the next bounded step**  ',
              'Status: **canonical runtime data materialized; targeted drum/provenance tests and maintained unit suite passed**  ',
              1,
          )
          old = 'Decoded canonical JSON SHA-256:\n\n`e7d3e14374d90a290fc19fa6f202c0776cccc299ce301b68fdc96af40877f0fc`'
          new = ('Staged payload JSON SHA-256 (before integration metadata reconciliation):\n\n'
                 '`e7d3e14374d90a290fc19fa6f202c0776cccc299ce301b68fdc96af40877f0fc`\n\n'
                 'Final canonical runtime JSON SHA-256:\n\n`' + sha + '`')
          text = text.replace(old, new, 1)
          marker = '\n## 13. Definition of done\n'
          evidence = f'''\n## 12a. Integration validation evidence\n\nThe one-shot branch job SHA-verified and materialized the staged payload, then compared `meter`, `period_bars` and `period_ticks` for all 54 rhythms against `main`. Ten authored entries had intentionally simpler/shorter metadata, but changing rhythm cycle length was not part of the user request. Their pre-refresh runtime metadata was therefore retained exactly. When the authored period was half the established period, the complete authored groove was repeated into the second half rather than leaving silence. No fill timing or transport behavior was changed.\n\nFinal canonical `drum_activity_timing.json` SHA-256: `{sha}`.\n\nValidation executed before commit:\n\n- staged payload structural validator: passed;\n- all 54 rhythm meter/period contracts compared against `main`; passed after cycle preservation;\n- every complete level remains <=56 events;\n- `tests/test_drum_patterns.py`: passed, including the new foundation-richness assertion;\n- `tests/test_catalogue_provenance.py`: passed;\n- `python tests/run_tests.py --suite unit`: passed.\n\nThe temporary payload, materializer and one-shot workflow are removed immediately after this validated commit, leaving `qt_frontend/music/drums/drum_activity_timing.json` as the single runtime authority.\n'''
          if '## 12a. Integration validation evidence' not in text:
              text = text.replace(marker, evidence + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit canonical data and regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            amysynth_version/qt_frontend/music/drums/drum_activity_timing.json \
            amysynth_version/qt_frontend/music/catalogue_provenance.json \
            amysynth_version/qt_frontend/tests/test_drum_patterns.py \
            amysynth_version/design/rhythm_rework/new_patterns/canonical_drum_data_manifest.json \
            amysynth_version/design/rhythm_rework/new_patterns/CODEX_HANDOVER_GAMMA9001_DRUM_PATTERN_REFRESH.md
          git diff --cached --check
          git commit -m 'Materialize richer Gamma9001 drum activity catalogue'
          git push origin HEAD:feature/gamma9001-drum-pattern-refresh
