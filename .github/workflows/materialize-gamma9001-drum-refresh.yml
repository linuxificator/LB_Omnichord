name: Materialize Gamma9001 drum refresh

on:
  push:
    branches:
      - feature/gamma9001-drum-pattern-refresh
    paths:
      - '.github/workflows/materialize-gamma9001-drum-refresh.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/gamma9001-drum-pattern-refresh

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify and materialize reviewed payload
        run: |
          python amysynth_version/design/rhythm_rework/new_patterns/materialize_gamma9001_drum_refresh.py --check
          python amysynth_version/design/rhythm_rework/new_patterns/materialize_gamma9001_drum_refresh.py

      - name: Reconcile Samba activity meter with canonical fill contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('amysynth_version')
          activity_path = root / 'qt_frontend/music/drums/drum_activity_timing.json'
          fills_path = root / 'qt_frontend/music/drums/drum_fills_timing.json'
          manifest_path = root / 'design/rhythm_rework/new_patterns/canonical_drum_data_manifest.json'
          provenance_path = root / 'qt_frontend/music/catalogue_provenance.json'

          activity = json.loads(activity_path.read_text(encoding='utf-8'))
          fills = json.loads(fills_path.read_text(encoding='utf-8'))
          samba = next(item for item in activity['rhythms'] if item['id'] == 'samba')
          fill_by_index = {int(item['index']): item for item in fills['fills']}
          samba_fill_indexes = [int(value) for value in fills['rhythm_fill_index']['samba']]
          samba_fill_meters = {fill_by_index[index]['meter'] for index in samba_fill_indexes}
          if samba_fill_meters != {'4/4'}:
              raise SystemExit(f'unexpected Samba fill meters: {sorted(samba_fill_meters)}')
          if samba['meter'] != '2/4':
              raise SystemExit(f'unexpected staged Samba activity meter: {samba["meter"]}')

          samba['meter'] = '4/4'
          expected_period = int(samba['period_bars']) * 4 * 96
          if int(samba['period_ticks']) != expected_period:
              raise SystemExit(
                  f'Samba period {samba["period_ticks"]} is incompatible with '
                  f'{samba["period_bars"]} bars of 4/4 at 96 PPQ (expected {expected_period})'
              )

          encoded = (json.dumps(activity, indent=2) + '\n').encode('utf-8')
          canonical_sha = hashlib.sha256(encoded).hexdigest()
          activity_path.write_bytes(encoded)

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for entry in manifest['files']:
              if entry['name'] == 'drum_activity_timing.json':
                  entry['sha256'] = canonical_sha
                  break
          else:
              raise SystemExit('manifest lacks drum_activity_timing.json')
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          provenance = json.loads(provenance_path.read_text(encoding='utf-8'))
          for entry in provenance['catalogues']:
              if entry['path'] == 'music/drums/drum_activity_timing.json':
                  entry['sha256'] = canonical_sha
                  entry['process'] = (
                      'LB-authored 2026-09-05 genre-convention refresh; Gamma9001 is the musical '
                      'reference while timing remains kit-independent; Samba activity meter '
                      'reconciled to the existing 4/4 fill/runtime contract during integration validation'
                  )
                  break
          else:
              raise SystemExit('provenance lacks drum activity entry')
          provenance['recorded'] = '2026-09-05'
          provenance_path.write_text(json.dumps(provenance, indent=2) + '\n', encoding='utf-8')

          print('CANONICAL_DRUM_ACTIVITY_SHA256', canonical_sha)
          print('SAMBA', samba['meter'], samba['period_bars'], samba['period_ticks'])
          PY

      - name: Add foundation richness regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('amysynth_version/qt_frontend/tests/test_drum_patterns.py')
          text = p.read_text(encoding='utf-8')
          method = '''    def test_foundation_levels_are_musically_usable(self) -> None:\n        for rhythm in self.catalog.rhythms.values():\n            foundation = rhythm.levels[0]\n            self.assertGreaterEqual(len(foundation), 5, rhythm.rhythm_id)\n            self.assertGreaterEqual(\n                len({event.role for event in foundation}),\n                2,\n                rhythm.rhythm_id,\n            )\n\n'''
          marker = '    def test_activity_levels_are_selected_complete_not_concatenated(self) -> None:\n'
          if 'def test_foundation_levels_are_musically_usable' not in text:
              if marker not in text:
                  raise SystemExit('test insertion marker not found')
              text = text.replace(marker, method + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Install frontend test dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -r requirements-test.txt

      - name: Run targeted drum and provenance tests
        working-directory: amysynth_version/qt_frontend
        run: |
          python tests/test_drum_patterns.py
          python tests/test_catalogue_provenance.py

      - name: Run maintained unit suite
        working-directory: amysynth_version/qt_frontend
        run: python tests/run_tests.py --suite unit

      - name: Record completion status
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          activity = Path('amysynth_version/qt_frontend/music/drums/drum_activity_timing.json')
          sha = hashlib.sha256(activity.read_bytes()).hexdigest()
          p = Path('amysynth_version/design/rhythm_rework/new_patterns/CODEX_HANDOVER_GAMMA9001_DRUM_PATTERN_REFRESH.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Status: **data authored and validated; materialization into the canonical runtime JSON is the next bounded step**  ',
              'Status: **canonical runtime data materialized; targeted drum/provenance tests and maintained unit suite passed**  ',
              1,
          )
          text = text.replace(
              'Decoded canonical JSON SHA-256:\n\n`e7d3e14374d90a290fc19fa6f202c0776cccc299ce301b68fdc96af40877f0fc`',
              'Staged payload JSON SHA-256 (before the Samba meter integration correction):\n\n`e7d3e14374d90a290fc19fa6f202c0776cccc299ce301b68fdc96af40877f0fc`\n\nFinal canonical runtime JSON SHA-256:\n\n`' + sha + '`',
              1,
          )
          marker = '\n## 13. Definition of done\n'
          evidence = f'''\n## 12a. Integration validation evidence\n\nThe one-shot branch job SHA-verified and materialized the complete staged payload. The first integration run exposed one real contract mismatch: the refreshed `samba` activity metadata said `2/4`, while the existing canonical Samba fills use the established 4/4 scheduling contract and legal starts on beats 3/4. The final canonical activity entry was therefore reconciled to `4/4`; no fill timing or test expectation was weakened.\n\nFinal canonical `drum_activity_timing.json` SHA-256: `{sha}`.\n\nValidation executed before commit:\n\n- staged payload structural validator: passed;\n- `tests/test_drum_patterns.py`: passed, including the new foundation-richness assertion;\n- `tests/test_catalogue_provenance.py`: passed;\n- `python tests/run_tests.py --suite unit`: passed.\n\nThe temporary payload, materializer and one-shot workflow are removed in the immediate cleanup commit, leaving `qt_frontend/music/drums/drum_activity_timing.json` as the single runtime authority.\n'''
          if '## 12a. Integration validation evidence' not in text:
              text = text.replace(marker, evidence + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit canonical data and regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            amysynth_version/qt_frontend/music/drums/drum_activity_timing.json \
            amysynth_version/qt_frontend/music/catalogue_provenance.json \
            amysynth_version/qt_frontend/tests/test_drum_patterns.py \
            amysynth_version/design/rhythm_rework/new_patterns/canonical_drum_data_manifest.json \
            amysynth_version/design/rhythm_rework/new_patterns/CODEX_HANDOVER_GAMMA9001_DRUM_PATTERN_REFRESH.md
          git diff --cached --check
          git commit -m 'Materialize richer Gamma9001 drum activity catalogue'
          git push origin HEAD:feature/gamma9001-drum-pattern-refresh
