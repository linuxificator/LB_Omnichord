name: Diversify Gamma9001 fill instrumentation

on:
  push:
    branches:
      - feature/gamma9001-drum-pattern-refresh
    paths:
      - '.github/workflows/diversify-gamma9001-fill-instrumentation.yml'

permissions:
  contents: write

jobs:
  diversify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/gamma9001-drum-pattern-refresh
          fetch-depth: 1

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            amysynth_version/qt_frontend/requirements.txt
            amysynth_version/qt_frontend/requirements-portable.txt
            amysynth_version/qt_frontend/requirements-test.txt
            amysynth_version/qt_frontend/packaging/constraints/desktop-current.txt

      - name: Apply instrumentation diversity pass
        run: python amysynth_version/design/rhythm_rework/new_patterns/diversify_gamma9001_fill_instrumentation.py

      - name: Keep pure fill planner metadata optional
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('amysynth_version/qt_frontend/code/rhythm_command_plan.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    @property\n    def fill_id(self) -> str: ...\n\n',
              '',
              1,
          )
          old = '''    for event in fill.events:\n        event_tick = event.tick // 2\n        events.append(\n            (\n                event_tick,\n                0,\n                hit_body(\n                    rhythm_id,\n                    event.role,\n                    event.velocity,\n                    fill=True,\n                    fill_id=fill.fill_id,\n                ),\n            )\n        )\n'''
          new = '''    fill_id = getattr(fill, "fill_id", None)\n    for event in fill.events:\n        event_tick = event.tick // 2\n        body = (\n            hit_body(rhythm_id, event.role, event.velocity, fill=True)\n            if fill_id is None\n            else hit_body(\n                rhythm_id,\n                event.role,\n                event.velocity,\n                fill=True,\n                fill_id=fill_id,\n            )\n        )\n        events.append((event_tick, 0, body))\n'''
          if old not in text:
              raise SystemExit('fill body compatibility marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install exact frontend test dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -c packaging/constraints/desktop-current.txt -r requirements-test.txt

      - name: Run focused drum regressions
        working-directory: amysynth_version/qt_frontend
        run: |
          python tests/test_drum_patterns.py
          python tests/test_catalogue_provenance.py
          python tests/test_sequencer_tags.py

      - name: Run maintained unit suite
        working-directory: amysynth_version/qt_frontend
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/amysynth_version/qt_frontend/tests/alsa-null.conf
          OMNICHORD_TEST_ARTIFACT_DIR: test-artifacts
        run: python tests/run_tests.py --suite unit --coverage

      - name: Remove temporary instrumentation machinery
        run: |
          rm amysynth_version/design/rhythm_rework/new_patterns/diversify_gamma9001_fill_instrumentation.py
          rm .github/workflows/diversify-gamma9001-fill-instrumentation.yml

      - name: Commit diversified fills
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Diversify Gamma9001 fill instrumentation'
          git push origin HEAD:feature/gamma9001-drum-pattern-refresh
