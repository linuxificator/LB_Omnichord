name: Test and release platform packages

on:
  push:
    branches: [main, testing/windows_smoke, integration/android_build]
  workflow_dispatch:

concurrency:
  group: desktop-package-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/integration/android_build'
    uses: ./.github/workflows/amy-regression.yml

  release-metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      stamp: ${{ steps.release.outputs.stamp }}
    steps:
      - name: Create release names
        id: release
        shell: bash
        run: |
          instant="$(date -u +%Y%m%dT%H%M%S)"
          echo "tag=R${instant}" >> "$GITHUB_OUTPUT"
          echo "stamp=R${instant/T/}" >> "$GITHUB_OUTPUT"

  linux-appimages:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'
    needs: [tests, release-metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            platform: Linux-x86_64
            constraints: desktop-current.txt
            tool_sha256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
            runtime_sha256: 1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf
          - runner: ubuntu-22.04-arm
            arch: aarch64
            platform: RaspberryPi-aarch64
            constraints: raspberrypi-aarch64.txt
            tool_sha256: 1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe
            runtime_sha256: 7d5d772b7c32f0c84caf0a452a3072a5709027d7eac5856feb89a7a7a8881372
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            amysynth_version/qt_frontend/requirements.txt
            amysynth_version/qt_frontend/requirements-portable.txt
            amysynth_version/qt_frontend/requirements-build.txt
            amysynth_version/qt_frontend/packaging/constraints/${{ matrix.constraints }}

      - name: Load exact release inputs
        run: >-
          python amysynth_version/qt_frontend/packaging/release_inputs.py
          github-env --output "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libfuse2
          python -m pip install \
            -c "amysynth_version/qt_frontend/packaging/constraints/${{ matrix.constraints }}" \
            -r amysynth_version/qt_frontend/requirements-build.txt

      - name: Install pinned AMY with Gamma9001 drum bank
        run: |
          python amysynth_version/qt_frontend/packaging/checkout_amy.py \
            --destination /tmp/amy-lb
          AMY_PCM_BANK="$AMY_PCM_BANK" \
            python -m pip install --no-cache-dir /tmp/amy-lb
          amy_so="$(python -c 'import c_amy; print(c_amy.__file__)')"
          nm -D "$amy_so" | grep 'amy_set_gamma9001_pcm' >/dev/null
          nm -D "$amy_so" | grep 'gamma9001_pcm_data' >/dev/null

      - name: Run portable external-input process contract
        working-directory: amysynth_version/qt_frontend
        run: python tests/contracts/test_external_input_processes.py

      - name: Download verified AppImage tools
        env:
          APPIMAGE_ARCH: ${{ matrix.arch }}
          TOOL_SHA256: ${{ matrix.tool_sha256 }}
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
        run: |
          curl -L --fail --silent --show-error \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage" \
            -o /tmp/appimagetool
          echo "$TOOL_SHA256  /tmp/appimagetool" | sha256sum --check --strict
          curl -L --fail --silent --show-error \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${APPIMAGE_ARCH}" \
            -o /tmp/appimage-runtime
          echo "$RUNTIME_SHA256  /tmp/appimage-runtime" | sha256sum --check --strict
          chmod +x /tmp/appimagetool

      - name: Build AppImage
        working-directory: amysynth_version/qt_frontend
        env:
          APPIMAGETOOL: /tmp/appimagetool
          APPIMAGE_RUNTIME_FILE: /tmp/appimage-runtime
          OMNICHORD_APPIMAGE_ARCH: ${{ matrix.arch }}
          OMNICHORD_APPIMAGE_PLATFORM: ${{ matrix.platform }}
          OMNICHORD_RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
        run: packaging/build_appimage.sh

      - name: Validate packaged application
        working-directory: amysynth_version/qt_frontend
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/amysynth_version/qt_frontend/tests/alsa-null.conf
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          package="dist/LB_Omnichord.${{ needs.release-metadata.outputs.stamp }}.${{ matrix.platform }}.AppImage"
          package_name="$(basename "$package")"
          capture="dist/${package_name}.acceptance"
          app_log="$capture/application.log"
          input_log="$capture/external-input-contract.log"
          mkdir -p "$capture"
          python tests/contracts/test_external_input_processes.py \
            > "$input_log" 2>&1
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            "$package" --windowed --capture-screenshots-dir "$capture" \
            > "$app_log" 2>&1
          cat "$app_log"
          python tests/support/package_evidence.py \
            --platform "${{ matrix.platform }}" \
            --artifact "$package" \
            --package-audit "$package.package-audit.json" \
            --qml-imports "$package.qml-imports.json" \
            --application-log "$app_log" \
            --external-input-contract-log "$input_log" \
            --screenshot "$capture/omni.png" \
            --screenshot "$capture/midi.png" \
            --regression-result success \
            --output "$package.evidence.json"
          (cd dist && sha256sum "$package_name" > "$package_name.sha256")

      - name: Upload Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.platform }}
          path: |
            amysynth_version/qt_frontend/dist/*.AppImage
            amysynth_version/qt_frontend/dist/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 2

      - name: Upload Linux package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.platform }}
          path: |
            amysynth_version/qt_frontend/dist/*.AppImage.package-audit.json
            amysynth_version/qt_frontend/dist/*.AppImage.qml-imports.json
            amysynth_version/qt_frontend/dist/*.AppImage.evidence.json
            amysynth_version/qt_frontend/dist/*.AppImage.acceptance/**
          if-no-files-found: error
          retention-days: 14

  macos-dmg:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'
    needs: [tests, release-metadata]
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            amysynth_version/qt_frontend/requirements.txt
            amysynth_version/qt_frontend/requirements-portable.txt
            amysynth_version/qt_frontend/requirements-build.txt
            amysynth_version/qt_frontend/packaging/constraints/desktop-current.txt

      - name: Load exact release inputs
        run: >-
          python amysynth_version/qt_frontend/packaging/release_inputs.py
          github-env --output "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          python -m pip install \
            -c amysynth_version/qt_frontend/packaging/constraints/desktop-current.txt \
            -r amysynth_version/qt_frontend/requirements-build.txt

      - name: Install pinned AMY with Gamma9001 drum bank
        run: |
          python amysynth_version/qt_frontend/packaging/checkout_amy.py \
            --destination /tmp/amy-lb
          AMY_PCM_BANK="$AMY_PCM_BANK" \
            python -m pip install --no-cache-dir /tmp/amy-lb
          amy_so="$(python -c 'import c_amy; print(c_amy.__file__)')"
          nm -gU "$amy_so" | grep 'amy_set_gamma9001_pcm' >/dev/null
          nm -gU "$amy_so" | grep 'gamma9001_pcm_data' >/dev/null

      - name: Run portable external-input process contract
        working-directory: amysynth_version/qt_frontend
        run: python tests/contracts/test_external_input_processes.py

      - name: Build and validate DMG
        working-directory: amysynth_version/qt_frontend
        env:
          OMNICHORD_RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
        run: |
          packaging/build_macos_dmg.sh
          package="dist/LB_Omnichord.${{ needs.release-metadata.outputs.stamp }}.macOS-arm64.dmg"
          hdiutil verify "$package"
          mountpoint="/tmp/lb-omnichord-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$package"
          cleanup_dmg() {
            for _ in {1..5}; do
              if hdiutil detach "$mountpoint"; then
                return
              fi
              sleep 1
            done
            hdiutil detach -force "$mountpoint"
          }
          trap cleanup_dmg EXIT
          app="$mountpoint/LB_Omnichord.app/Contents/MacOS/LB_Omnichord"
          package_name="$(basename "$package")"
          capture="dist/${package_name}.acceptance"
          app_log="$capture/application.log"
          input_log="$capture/external-input-contract.log"
          mkdir -p "$capture"
          python tests/contracts/test_external_input_processes.py \
            > "$input_log" 2>&1
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            "$app" --windowed --capture-screenshots-dir "$capture" \
            > "$app_log" 2>&1
          cat "$app_log"
          python tests/support/package_evidence.py \
            --platform macOS-arm64 \
            --artifact "$package" \
            --package-audit "$package.package-audit.json" \
            --qml-imports "$package.qml-imports.json" \
            --application-log "$app_log" \
            --external-input-contract-log "$input_log" \
            --screenshot "$capture/omni.png" \
            --screenshot "$capture/midi.png" \
            --regression-result success \
            --output "$package.evidence.json"
          cleanup_dmg
          trap - EXIT
          (cd dist && shasum -a 256 "$package_name" > "$package_name.sha256")

      - name: Upload macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-macOS-arm64
          path: |
            amysynth_version/qt_frontend/dist/*.dmg
            amysynth_version/qt_frontend/dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 2

      - name: Upload macOS package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-macOS-arm64
          path: |
            amysynth_version/qt_frontend/dist/*.dmg.package-audit.json
            amysynth_version/qt_frontend/dist/*.dmg.qml-imports.json
            amysynth_version/qt_frontend/dist/*.dmg.evidence.json
            amysynth_version/qt_frontend/dist/*.dmg.acceptance/**
          if-no-files-found: error
          retention-days: 14

  windows-native:
    if: >-
      always() &&
      needs.release-metadata.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
        needs.tests.result == 'success') ||
       github.ref == 'refs/heads/testing/windows_smoke' ||
       (github.ref == 'refs/heads/main' &&
        needs.tests.result == 'success'))
    needs: [tests, release-metadata]
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            amysynth_version/qt_frontend/requirements.txt
            amysynth_version/qt_frontend/requirements-portable.txt
            amysynth_version/qt_frontend/requirements-build.txt
            amysynth_version/qt_frontend/packaging/constraints/desktop-current.txt

      - name: Load exact release inputs
        shell: pwsh
        run: >-
          python amysynth_version/qt_frontend/packaging/release_inputs.py
          github-env --output "$env:GITHUB_ENV"

      - name: Install frontend and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install -c amysynth_version/qt_frontend/packaging/constraints/desktop-current.txt -r amysynth_version/qt_frontend/requirements-build.txt

      - name: Run portable external-input process contract
        shell: pwsh
        working-directory: amysynth_version/qt_frontend
        run: python tests\contracts\test_external_input_processes.py

      - name: Checkout pinned AMY fork
        shell: pwsh
        run: |
          python amysynth_version/qt_frontend/packaging/checkout_amy.py `
            --destination "$env:RUNNER_TEMP\amy-lb"

      - name: Build native service and portable package
        shell: pwsh
        env:
          OMNICHORD_RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
          OMNICHORD_AMY_ROOT: ${{ runner.temp }}\amy-lb
        working-directory: amysynth_version/qt_frontend
        run: ./packaging/build_windows.ps1

      - name: Validate separate native service and frontend
        shell: pwsh
        working-directory: amysynth_version/qt_frontend
        timeout-minutes: 4
        run: |
          $package = "dist\LB_Omnichord.${{ needs.release-metadata.outputs.stamp }}.Windows-x86_64.zip"
          Expand-Archive -Path $package -DestinationPath "$env:RUNNER_TEMP\lb-package"
          $root = "$env:RUNNER_TEMP\lb-package"
          if (-not (Test-Path "$root\LB_Omnichord.exe")) { throw "Frontend executable missing" }
          if (-not (Test-Path "$root\run_windows.ps1")) { throw "Launcher missing" }
          if (-not (Test-Path "$root\LB_Omnichord.cmd")) { throw "Double-click launcher missing" }
          $testUser = "$env:RUNNER_TEMP\lb-omnichord-package-user"
          $capture = Join-Path (Get-Location) "dist\$([IO.Path]::GetFileName($package)).acceptance"
          $appLog = Join-Path $capture "application.log"
          $inputLog = Join-Path $capture "external-input-contract.log"
          New-Item -ItemType Directory -Force -Path $testUser, $capture | Out-Null
          $env:USERPROFILE = $testUser
          $env:LOCALAPPDATA = $testUser
          $env:CI = "true"
          python tests\contracts\test_external_input_processes.py *> $inputLog
          if ($LASTEXITCODE -ne 0) { throw "External input process contract failed" }
          $appOut = Join-Path $capture "application.stdout.log"
          $appErr = Join-Path $capture "application.stderr.log"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $quotedScript = '"' + "$root\run_windows.ps1" + '"'
          $quotedCapture = '"' + $capture + '"'
          $launcherArguments = @(
            "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", $quotedScript,
            "-Windowed", "-CaptureScreenshotsDir", $quotedCapture
          )
          $launcher = Start-Process -FilePath "powershell.exe" `
            -ArgumentList $launcherArguments -PassThru -NoNewWindow `
            -RedirectStandardOutput $appOut -RedirectStandardError $appErr
          $timedOut = -not $launcher.WaitForExit(60000)
          if ($timedOut) {
            taskkill.exe /PID $launcher.Id /T /F | Out-Null
          }
          $launcher.WaitForExit()
          @(
            if (Test-Path $appOut) { Get-Content -Raw $appOut }
            if (Test-Path $appErr) { Get-Content -Raw $appErr }
          ) | Set-Content -Path $appLog
          if ($timedOut) {
            Get-Content $appLog
            throw "Windows package launcher exceeded its external 60 second deadline"
          }
          if ($launcher.ExitCode -ne 0) {
            Get-Content $appLog
            throw "Windows package launcher failed with status $($launcher.ExitCode)"
          }
          Get-Content $appLog
          if ((Get-Process -Name amy_service -ErrorAction SilentlyContinue)) { throw "Service leaked after package capture" }
          python tests\support\package_evidence.py `
            --platform Windows-x86_64 `
            --artifact $package `
            --package-audit "$package.package-audit.json" `
            --qml-imports "$package.qml-imports.json" `
            --application-log $appLog `
            --external-input-contract-log $inputLog `
            --screenshot (Join-Path $capture "omni.png") `
            --screenshot (Join-Path $capture "midi.png") `
            --regression-result success `
            --output "$package.evidence.json"

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-Windows-x86_64
          path: |
            amysynth_version/qt_frontend/dist/*.zip
            amysynth_version/qt_frontend/dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 2

      - name: Upload Windows package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-Windows-x86_64
          path: |
            amysynth_version/qt_frontend/dist/*.zip.package-audit.json
            amysynth_version/qt_frontend/dist/*.zip.qml-imports.json
            amysynth_version/qt_frontend/dist/*.zip.evidence.json
            amysynth_version/qt_frontend/dist/*.zip.acceptance/**
          if-no-files-found: error
          retention-days: 14

  android-packages:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/integration/android_build'
    needs: [tests, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            output_arch: x86_64
            artifact_name: android-emulator-x86_64
            pyside_wheel: pyside6-6.11.2-6.11.2-cp311-cp311-android_x86_64.whl
            pyside_sha256: 7dc0335592a11a612fd6a16b48b202ddd85bf0bcd2d2e3fc2d50dbb8e4f7a5fe
            shiboken_wheel: shiboken6-6.11.2-6.11.2-cp311-cp311-android_x86_64.whl
            shiboken_sha256: 642bb59b6f4654236f8cba0c2fa45dbfcca6363d83b2c1b53f245a2a7bd77530
          - arch: aarch64
            output_arch: arm64
            artifact_name: package-Android-arm64
            pyside_wheel: pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl
            pyside_sha256: c5288e0740ad91d87d4cafa16132768c149c56521bf63c83c98404b865911678
            shiboken_wheel: shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl
            shiboken_sha256: e99609b689d3df2ac97ffbe17df0ce8b1246b2c47b4d24f6fb73f1eaad4bd0f2

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.11 for Qt Android deployment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements-android-host.txt

      - name: Load exact release inputs
        run: >-
          python amysynth_version/qt_frontend/packaging/release_inputs.py
          github-env --output "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, verified 2026-09-01
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android and host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake ccache cmake libffi-dev libltdl-dev \
            libncurses5-dev libncursesw5-dev libssl-dev libtool \
            pkg-config unzip zip zlib1g-dev
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'

      - name: Install pinned Qt Android deployment frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r amysynth_version/qt_frontend/requirements-android-host.txt
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          import PySide6

          requirements = Path(PySide6.__file__).parent / "scripts" / "requirements-android.txt"
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "-r", str(requirements)],
              check=True,
          )
          PY

      - name: Run portable external-input process contract
        working-directory: amysynth_version/qt_frontend
        run: python tests/contracts/test_external_input_processes.py

      - name: Build pinned AMY service AAR
        run: |
          python amysynth_version/qt_frontend/packaging/checkout_amy.py \
            --destination "$RUNNER_TEMP/amy-lb"
          gradle -p "$RUNNER_TEMP/amy-lb/android" \
            :amy-service:assembleDebug --stacktrace

      - name: Download verified Qt for Python Android wheels
        env:
          PYSIDE_WHEEL: ${{ matrix.pyside_wheel }}
          PYSIDE_SHA256: ${{ matrix.pyside_sha256 }}
          SHIBOKEN_WHEEL: ${{ matrix.shiboken_wheel }}
          SHIBOKEN_SHA256: ${{ matrix.shiboken_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/qt-android-wheels"
          curl -L --fail --silent --show-error \
            "https://download.qt.io/official_releases/QtForPython/pyside6/$PYSIDE_WHEEL" \
            -o "$RUNNER_TEMP/qt-android-wheels/$PYSIDE_WHEEL"
          curl -L --fail --silent --show-error \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/$SHIBOKEN_WHEEL" \
            -o "$RUNNER_TEMP/qt-android-wheels/$SHIBOKEN_WHEEL"
          echo "$PYSIDE_SHA256  $RUNNER_TEMP/qt-android-wheels/$PYSIDE_WHEEL" \
            | sha256sum --check --strict
          echo "$SHIBOKEN_SHA256  $RUNNER_TEMP/qt-android-wheels/$SHIBOKEN_WHEEL" \
            | sha256sum --check --strict

      - name: Restore architecture-specific python-for-Android build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lb-android-${{ matrix.arch }}/.buildozer
          key: >-
            android-p4a-v1-${{ runner.os }}-${{ matrix.arch }}-
            ${{ matrix.pyside_sha256 }}-${{ matrix.shiboken_sha256 }}-
            ${{ hashFiles('amysynth_version/qt_frontend/requirements-android-host.txt',
            'amysynth_version/qt_frontend/packaging/android/build_android.py',
            'amysynth_version/qt_frontend/packaging/android/prune_pyside_wheel.py') }}

      - name: Build Qt frontend plus separate AMY service APK
        working-directory: amysynth_version/qt_frontend
        env:
          PYSIDE_WHEEL: ${{ matrix.pyside_wheel }}
          SHIBOKEN_WHEEL: ${{ matrix.shiboken_wheel }}
        run: |
          python packaging/android/build_android.py \
            --frontend "$PWD" \
            --build-dir "$RUNNER_TEMP/lb-android-${{ matrix.arch }}" \
            --aar "$RUNNER_TEMP/amy-lb/android/amy-service/build/outputs/aar/amy-service-debug.aar" \
            --wheel-pyside "$RUNNER_TEMP/qt-android-wheels/$PYSIDE_WHEEL" \
            --wheel-shiboken "$RUNNER_TEMP/qt-android-wheels/$SHIBOKEN_WHEEL" \
            --ndk "$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            --sdk "$ANDROID_SDK_ROOT" \
            --arch '${{ matrix.arch }}' \
            --release-stamp '${{ needs.release-metadata.outputs.stamp }}'

      - name: Upload Android package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            amysynth_version/qt_frontend/dist/*Android-${{ matrix.output_arch }}.apk
            amysynth_version/qt_frontend/dist/*Android-${{ matrix.output_arch }}.apk.sha256
          if-no-files-found: error
          retention-days: 2

      - name: Upload Android package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.artifact_name }}
          path: |
            amysynth_version/qt_frontend/dist/*Android-${{ matrix.output_arch }}.apk.package-audit.json
            amysynth_version/qt_frontend/dist/*Android-${{ matrix.output_arch }}.apk.pyside-prune.json
          if-no-files-found: error
          retention-days: 14

  android-emulator:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/integration/android_build'
    needs: [android-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Install external-input test peer dependencies
        run: python3 -m pip install -r amysynth_version/qt_frontend/requirements-portable.txt

      - name: Load exact release inputs
        run: >-
          python3 amysynth_version/qt_frontend/packaging/release_inputs.py
          github-env --output "$GITHUB_ENV"

      - name: Download x86_64 Android package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-emulator-x86_64
          path: android-package

      - name: Download x86_64 Android package evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: evidence-android-emulator-x86_64
          path: android-package-evidence

      - name: Checkout pinned AMY audio analyzer
        run: |
          python3 amysynth_version/qt_frontend/packaging/checkout_amy.py \
            --destination "$RUNNER_TEMP/amy-lb"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Packaged Android end-to-end smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash amysynth_version/qt_frontend/packaging/android/test_android_apk.sh

      - name: Upload Omnichord Android smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lb-omnichord-android-smoke
          path: android-audio-capture/
          if-no-files-found: error
          retention-days: 7

  esp32p4-firmware:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'
    needs: [tests, release-metadata]
    uses: ./.github/workflows/esp32p4-build.yml
    with:
      profile: all

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: [release-metadata, linux-appimages, macos-dmg, windows-native, android-packages, android-emulator, esp32p4-firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout released source metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Load exact release inputs
        run: >-
          python3 amysynth_version/qt_frontend/packaging/release_inputs.py
          github-env --output "$GITHUB_ENV"

      - name: Download all validated packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Download validated ESP32-P4 v1 firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: esp32p4-firmware-v1
          path: esp32p4-firmware/v1

      - name: Download validated ESP32-P4 v3 firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: esp32p4-firmware-v3
          path: esp32p4-firmware/v3

      - name: Assemble ESP32-P4 release asset
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          firmware_zip="LB_Omnichord.${RELEASE_TAG}.ESP32P4.zip"
          python3 amysynth_version/esp32p4/assemble_release.py \
            --release-name "$RELEASE_TAG" \
            --v1 esp32p4-firmware/v1 \
            --v3 esp32p4-firmware/v3 \
            --output-dir firmware-dist
          (cd firmware-dist && sha256sum --check "$firmware_zip.sha256")
          printf '%s\n' "$(cat firmware-dist/$firmware_zip.sha256)" \
            > firmware-subject.sha256

      - name: Verify exact five-platform asset set
        env:
          RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
        run: |
          python3 amysynth_version/qt_frontend/packaging/release_inputs.py \
            release-manifest \
            --directory dist \
            --release-stamp "$RELEASE_STAMP" \
            --source-commit "$GITHUB_SHA" \
            --output release-manifest.json

      - name: Generate release SPDX SBOM and attestation subjects
        env:
          RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
        run: |
          sbom="LB_Omnichord.${RELEASE_STAMP}.spdx.json"
          python3 amysynth_version/qt_frontend/packaging/release_sbom.py \
            --manifest release-manifest.json \
            --output "$sbom"
          jq -r '.packages[] | "\(.sha256)  \(.file)"' \
            release-manifest.json > release-subjects.sha256

      - name: Attest five-package build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-subjects.sha256

      - name: Attest five-package SPDX SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-subjects.sha256
          sbom-path: LB_Omnichord.${{ needs.release-metadata.outputs.stamp }}.spdx.json

      - name: Attest ESP32-P4 firmware provenance
        id: firmware-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: firmware-subject.sha256

      - name: Preserve and independently verify signed attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          cp '${{ steps.provenance.outputs.bundle-path }}' \
            "LB_Omnichord.${RELEASE_STAMP}.provenance.sigstore.json"
          cp '${{ steps.sbom.outputs.bundle-path }}' \
            "LB_Omnichord.${RELEASE_STAMP}.sbom.sigstore.json"
          cp '${{ steps.firmware-provenance.outputs.bundle-path }}' \
            "LB_Omnichord.${RELEASE_TAG}.ESP32P4.provenance.sigstore.json"
          while read -r package; do
            gh attestation verify "dist/$package" \
              --repo "$GITHUB_REPOSITORY"
            gh attestation verify "dist/$package" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://spdx.dev/Document/v2.3
          done < <(jq -r '.packages[].file' release-manifest.json)
          firmware_zip="LB_Omnichord.${RELEASE_TAG}.ESP32P4.zip"
          gh attestation verify "firmware-dist/$firmware_zip" \
            --repo "$GITHUB_REPOSITORY"

      - name: Create tag and platform release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
        run: |
          mapfile -t release_assets < <(
            jq -r '.packages[] | .file, .checksum_file' release-manifest.json
          )
          evidence_assets=(
            release-manifest.json
            "LB_Omnichord.${RELEASE_STAMP}.spdx.json"
            "LB_Omnichord.${RELEASE_STAMP}.provenance.sigstore.json"
            "LB_Omnichord.${RELEASE_STAMP}.sbom.sigstore.json"
            "LB_Omnichord.${RELEASE_TAG}.ESP32P4.provenance.sigstore.json"
          )
          linux_file="LB_Omnichord.${RELEASE_STAMP}.Linux-x86_64.AppImage"
          pi_file="LB_Omnichord.${RELEASE_STAMP}.RaspberryPi-aarch64.AppImage"
          mac_file="LB_Omnichord.${RELEASE_STAMP}.macOS-arm64.dmg"
          windows_file="LB_Omnichord.${RELEASE_STAMP}.Windows-x86_64.zip"
          android_file="LB_Omnichord.${RELEASE_STAMP}.Android-arm64.apk"
          esp32p4_file="LB_Omnichord.${RELEASE_TAG}.ESP32P4.zip"
          {
            echo '## Linux x64'
            echo
            echo "Download \`$linux_file\` and its SHA-256 file."
            echo
            echo '## Raspberry Pi 4 / 5 (64-bit Raspberry Pi OS)'
            echo
            echo "Download \`$pi_file\` and its SHA-256 file. This Pi 4 baseline also runs on Pi 5."
            echo
            echo '## macOS Apple Silicon'
            echo
            echo "Download \`$mac_file\` and its SHA-256 file. This build is ad-hoc signed, but it is not signed with an Apple Developer ID and is not Apple-notarized. macOS therefore blocks the first normal launch by default."
            echo
            echo 'Installation:'
            echo
            echo '1. Open the DMG, drag `LB_Omnichord.app` to `Applications`, then eject the DMG.'
            echo '2. Open `Applications` in Finder and double-click `LB_Omnichord`. macOS shows a warning and blocks this first launch; dismiss the warning.'
            echo '3. Open the Apple menu, choose `System Settings`, select `Privacy & Security` in the sidebar, and scroll down to `Security`.'
            echo '4. Find the message about `LB_Omnichord` and click `Open Anyway`. This button is available for about one hour after the blocked launch attempt.'
            echo '5. Enter your Mac login password or use Touch ID if macOS asks for confirmation.'
            echo '6. When the warning appears again, click `Open`. macOS saves an exception for this app, so later launches work normally.'
            echo
            echo 'This app-specific exception is sufficient; do not disable Gatekeeper or globally weaken `Allow applications downloaded from`.'
            echo
            echo '[Apple: Open a Mac app from an unknown developer](https://support.apple.com/en-gb/guide/mac-help/mh40616/mac)'
            echo
            echo '## Windows native (experimental)'
            echo
            echo "Download \`$windows_file\` and its SHA-256 file, extract the complete zip, then double-click \`LB_Omnichord.cmd\`. Do not use Explorer's \`Run with PowerShell\` on the internal \`run_windows.ps1\`: the double-click launcher supplies a process-only execution-policy bypass and keeps startup errors visible."
            echo
            echo 'The portable directory contains separate native AMY and Qt frontend executables; it is not a single executable and the extracted files must stay together. Native Windows pointer hardware, audio and MIDI still need physical validation.'
            echo
            echo '## Android arm64 (experimental)'
            echo
            echo "Download \`$android_file\` and its SHA-256 file, allow installation from this source when Android asks, then install the APK. The package contains a PySide6 frontend and a separate private AMY/Oboe service process communicating through the app-private \`amy.sock\`."
            echo
            echo 'This package is CI debug-signed so it can be installed and emulator-tested without a repository signing secret. It is not a Play Store bundle or a stable update channel, and physical touchscreen, speaker, route-change and latency validation is still required.'
            echo
            echo '## ESP32-P4 firmware (v1.x and v3.x silicon)'
            echo
            echo "Download \`$esp32p4_file\` and its SHA-256 file. It expands to a versioned directory containing separate \`v1/\` and \`v3/\` image directories, flashing instructions, and Python flashers for both legacy and current esptool syntax. Use \`v1\` for revision 1.x silicon, including the physically tested v1.3 board; use \`v3\` only for revision 3.x silicon."
            echo
            echo 'Both firmware profiles receive native AMY wire commands through the LP UART at 1,000,000 baud, include Gamma9001, 11 buses, capacity for 1280 reusable-sequence tags, and the physically selected 48 kHz / 128-sample / 2 x 64-frame audio geometry. CI proves compilation and image structure; v3 I2S audio and LP-UART operation still require physical-board validation.'
            echo
            echo '## Build provenance'
            echo
            echo "AMY fork release: \`$AMY_RELEASE_BRANCH\` at immutable build commit \`$AMY_COMMIT\`."
            echo
            echo 'Each application package has signed GitHub build-provenance and SPDX 2.3 SBOM attestations. The ESP32-P4 firmware has a separate signed build-provenance attestation. Download an asset and verify it with `gh attestation verify ASSET --repo linuxificator/LB_Omnichord`; add `--predicate-type https://spdx.dev/Document/v2.3` for an application package to verify and inspect its SBOM attestation.'
          } > release-notes.md
          for index in "${!release_assets[@]}"; do
            release_assets[$index]="dist/${release_assets[$index]}"
          done
          release_assets+=(
            "firmware-dist/$esp32p4_file"
            "firmware-dist/$esp32p4_file.sha256"
          )
          gh release create "$RELEASE_TAG" \
            "${release_assets[@]}" "${evidence_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md
          {
            jq -r '.packages[] | .file, .checksum_file' release-manifest.json
            printf '%s\n' "$esp32p4_file" "$esp32p4_file.sha256"
            printf '%s\n' "${evidence_assets[@]}"
          } | sort > expected-assets.txt
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' \
            | sort > published-assets.txt
          diff -u expected-assets.txt published-assets.txt

  refresh-readme-screenshots:
    if: github.ref == 'refs/heads/main'
    needs: [publish-release, release-metadata]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout released commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            amysynth_version/qt_frontend/requirements-portable.txt
            amysynth_version/qt_frontend/requirements.txt
            amysynth_version/qt_frontend/packaging/constraints/desktop-current.txt

      - name: Install screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
          python -m pip install \
            -c amysynth_version/qt_frontend/packaging/constraints/desktop-current.txt \
            -r amysynth_version/qt_frontend/requirements.txt

      - name: Capture and validate the released interface
        run: |
          python amysynth_version/qt_frontend/capture_screenshots.py
          python amysynth_version/qt_frontend/tools/update_release_screenshots.py \
            --release-tag '${{ needs.release-metadata.outputs.tag }}'
          python amysynth_version/qt_frontend/tests/test_static_contracts.py

      - name: Commit changed README screenshots without rebuild
        run: |
          release_tag='${{ needs.release-metadata.outputs.tag }}'
          changed_files=(
            README.md
            amysynth_version/qt_frontend/screenshots
          )
          if git diff --quiet -- "${changed_files[@]}"; then
            echo 'README screenshots already match the released interface.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "${changed_files[@]}"
          git commit -m 'Refresh README screenshots' \
            -m 'skip-rebuild: README screenshots only' \
            -m 'skip-checks:true'
          git push origin HEAD:main
