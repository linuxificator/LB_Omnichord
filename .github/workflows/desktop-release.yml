name: Test and release platform packages

on:
  push:
    branches: [main, testing/windows_smoke, integration/android_build]
  workflow_dispatch:

concurrency:
  group: desktop-package-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  AMY_RELEASE_BRANCH: releases/amy_omnichord_R20260831T042456
  AMY_COMMIT: 14240031c135fdcd76a7a3a8ec81da8ef405c4b0

jobs:
  tests:
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/integration/android_build'
    uses: ./.github/workflows/amy-regression.yml

  release-metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      stamp: ${{ steps.release.outputs.stamp }}
    steps:
      - name: Create release names
        id: release
        shell: bash
        run: |
          instant="$(date -u +%Y%m%dT%H%M%S)"
          echo "tag=R${instant}" >> "$GITHUB_OUTPUT"
          echo "stamp=R${instant/T/}" >> "$GITHUB_OUTPUT"

  linux-appimages:
    if: github.ref == 'refs/heads/main'
    needs: [tests, release-metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            platform: Linux-x86_64
            tool_sha256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
            runtime_sha256: 1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf
          - runner: ubuntu-22.04-arm
            arch: aarch64
            platform: RaspberryPi-aarch64
            tool_sha256: 1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe
            runtime_sha256: 7d5d772b7c32f0c84caf0a452a3072a5709027d7eac5856feb89a7a7a8881372
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libfuse2
          python -m pip install \
            -r amysynth_version/qt_frontend/requirements.txt \
            'pyinstaller==6.22.2'

      - name: Install pinned AMY with ESP32-compatible drum bank
        run: |
          git clone https://github.com/linuxificator/amy.git /tmp/amy-lb
          git -C /tmp/amy-lb merge-base --is-ancestor \
            "$AMY_COMMIT" "origin/$AMY_RELEASE_BRANCH"
          git -C /tmp/amy-lb checkout "$AMY_COMMIT"
          test "$(git -C /tmp/amy-lb rev-parse HEAD)" = "$AMY_COMMIT"
          AMY_PCM_BANK=tiny python -m pip install --no-cache-dir /tmp/amy-lb
          amy_so="$(python -c 'import c_amy; print(c_amy.__file__)')"
          if nm -D "$amy_so" | grep -Eq 'gamma9001|amy_set_gamma'; then
            echo 'AMY was built with the wrong PCM bank' >&2
            exit 1
          fi

      - name: Download verified AppImage tools
        env:
          APPIMAGE_ARCH: ${{ matrix.arch }}
          TOOL_SHA256: ${{ matrix.tool_sha256 }}
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
        run: |
          curl -L --fail --silent --show-error \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage" \
            -o /tmp/appimagetool
          echo "$TOOL_SHA256  /tmp/appimagetool" | sha256sum --check --strict
          curl -L --fail --silent --show-error \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${APPIMAGE_ARCH}" \
            -o /tmp/appimage-runtime
          echo "$RUNTIME_SHA256  /tmp/appimage-runtime" | sha256sum --check --strict
          chmod +x /tmp/appimagetool

      - name: Build AppImage
        working-directory: amysynth_version/qt_frontend
        env:
          APPIMAGETOOL: /tmp/appimagetool
          APPIMAGE_RUNTIME_FILE: /tmp/appimage-runtime
          OMNICHORD_APPIMAGE_ARCH: ${{ matrix.arch }}
          OMNICHORD_APPIMAGE_PLATFORM: ${{ matrix.platform }}
          OMNICHORD_RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
        run: packaging/build_appimage.sh

      - name: Validate packaged application
        working-directory: amysynth_version/qt_frontend
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/amysynth_version/qt_frontend/tests/alsa-null.conf
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          package="dist/LB_Omnichord.${{ needs.release-metadata.outputs.stamp }}.${{ matrix.platform }}.AppImage"
          "$package" --package-self-test
          QT_QPA_PLATFORM=offscreen "$package" --windowed \
            > /tmp/omnichord-package-smoke.log 2>&1 &
          app_pid=$!
          for _ in {1..80}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/omnichord-package-smoke.log
              echo 'AppImage stopped during startup' >&2
              exit 1
            fi
            if grep -q 'AMY backend: external socket' \
              /tmp/omnichord-package-smoke.log; then
              break
            fi
            sleep 0.1
          done
          cat /tmp/omnichord-package-smoke.log
          grep -q 'AMY service ready:' /tmp/omnichord-package-smoke.log
          grep -q 'AMY backend: external socket' /tmp/omnichord-package-smoke.log
          kill -TERM "$app_pid"
          wait "$app_pid" || true
          package_name="$(basename "$package")"
          (cd dist && sha256sum "$package_name" > "$package_name.sha256")

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            amysynth_version/qt_frontend/dist/*.AppImage
            amysynth_version/qt_frontend/dist/*.sha256
          if-no-files-found: error
          retention-days: 2

  macos-dmg:
    if: github.ref == 'refs/heads/main'
    needs: [tests, release-metadata]
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install \
            -r amysynth_version/qt_frontend/requirements.txt \
            'pyinstaller==6.22.2'

      - name: Install pinned AMY with ESP32-compatible drum bank
        run: |
          git clone https://github.com/linuxificator/amy.git /tmp/amy-lb
          git -C /tmp/amy-lb merge-base --is-ancestor \
            "$AMY_COMMIT" "origin/$AMY_RELEASE_BRANCH"
          git -C /tmp/amy-lb checkout "$AMY_COMMIT"
          test "$(git -C /tmp/amy-lb rev-parse HEAD)" = "$AMY_COMMIT"
          AMY_PCM_BANK=tiny python -m pip install --no-cache-dir /tmp/amy-lb

      - name: Build and validate DMG
        working-directory: amysynth_version/qt_frontend
        env:
          OMNICHORD_RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
        run: |
          packaging/build_macos_dmg.sh
          package="dist/LB_Omnichord.${{ needs.release-metadata.outputs.stamp }}.macOS-arm64.dmg"
          hdiutil verify "$package"
          mountpoint="/tmp/lb-omnichord-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$package"
          cleanup_dmg() {
            for _ in {1..5}; do
              if hdiutil detach "$mountpoint"; then
                return
              fi
              sleep 1
            done
            hdiutil detach -force "$mountpoint"
          }
          trap cleanup_dmg EXIT
          app="$mountpoint/LB_Omnichord.app/Contents/MacOS/LB_Omnichord"
          "$app" --package-self-test
          smoke_status=/tmp/omnichord-package-smoke.status
          rm -f "$smoke_status"
          set +e
          OMNICHORD_PACKAGE_SMOKE_STATUS="$smoke_status" \
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            "$app" --windowed --package-smoke-test \
            > /tmp/omnichord-package-smoke.log 2>&1
          app_status=$?
          set -e
          cat /tmp/omnichord-package-smoke.log
          if [[ "$app_status" -ne 0 ]]; then
            echo "Packaged macOS application exit status: $app_status" >&2
            cat "$smoke_status" >&2 || true
            exit "$app_status"
          fi
          grep -q 'AMY service ready:' /tmp/omnichord-package-smoke.log
          grep -q 'AMY backend: external socket' /tmp/omnichord-package-smoke.log
          for checkpoint in \
            qml-root-ready \
            qml-chord-press-observed \
            active-chord-visible \
            qml-chord-tap-released \
            qml-chord-hold-promoted \
            qml-chord-hold-released \
            event-loop-exited; do
            grep -q "$checkpoint" "$smoke_status"
          done
          cleanup_dmg
          trap - EXIT
          package_name="$(basename "$package")"
          (cd dist && shasum -a 256 "$package_name" > "$package_name.sha256")

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: package-macOS-arm64
          path: |
            amysynth_version/qt_frontend/dist/*.dmg
            amysynth_version/qt_frontend/dist/*.sha256
          if-no-files-found: error
          retention-days: 2

  windows-native:
    if: >-
      always() &&
      needs.release-metadata.result == 'success' &&
      (github.ref == 'refs/heads/testing/windows_smoke' ||
       (github.ref == 'refs/heads/main' &&
        needs.tests.result == 'success'))
    needs: [tests, release-metadata]
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements.txt

      - name: Install frontend and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install -r amysynth_version/qt_frontend/requirements.txt pyinstaller==6.22.2

      - name: Checkout pinned AMY fork
        shell: pwsh
        run: |
          git clone https://github.com/linuxificator/amy.git "$env:RUNNER_TEMP\amy-lb"
          git -C "$env:RUNNER_TEMP\amy-lb" merge-base --is-ancestor `
            $env:AMY_COMMIT "origin/$env:AMY_RELEASE_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "AMY commit is not on declared release branch" }
          git -C "$env:RUNNER_TEMP\amy-lb" checkout $env:AMY_COMMIT
          $actualAmyCommit = (git -C "$env:RUNNER_TEMP\amy-lb" rev-parse HEAD).Trim()
          if ($actualAmyCommit -ne $env:AMY_COMMIT) { throw "AMY checkout did not resolve to pinned commit" }

      - name: Build native service and portable package
        shell: pwsh
        env:
          OMNICHORD_RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
          OMNICHORD_AMY_ROOT: ${{ runner.temp }}\amy-lb
        working-directory: amysynth_version/qt_frontend
        run: ./packaging/build_windows.ps1

      - name: Validate separate native service and frontend
        shell: pwsh
        working-directory: amysynth_version/qt_frontend
        run: |
          $package = "dist\LB_Omnichord.${{ needs.release-metadata.outputs.stamp }}.Windows-x86_64.zip"
          Expand-Archive -Path $package -DestinationPath "$env:RUNNER_TEMP\lb-package"
          $root = "$env:RUNNER_TEMP\lb-package"
          & "$root\amy_service.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Native AMY service self-test failed" }
          if (-not (Test-Path "$root\LB_Omnichord.exe")) { throw "Frontend executable missing" }
          if (-not (Test-Path "$root\run_windows.ps1")) { throw "Launcher missing" }
          if (-not (Test-Path "$root\LB_Omnichord.cmd")) { throw "Double-click launcher missing" }
          if ((Get-Process -Name amy_service -ErrorAction SilentlyContinue)) { throw "Service leaked during self-test" }
          $smokeUser = "$env:RUNNER_TEMP\lb-omnichord-smoke-user"
          New-Item -ItemType Directory -Force -Path $smokeUser | Out-Null
          $env:USERPROFILE = $smokeUser
          $env:LOCALAPPDATA = $smokeUser
          & "$root\LB_Omnichord.cmd" -Windowed -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw "Windows package launcher failed" }
          if ((Get-Process -Name amy_service -ErrorAction SilentlyContinue)) { throw "Service leaked during package smoke test" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: package-Windows-x86_64
          path: |
            amysynth_version/qt_frontend/dist/*.zip
            amysynth_version/qt_frontend/dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 2

  android-packages:
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/integration/android_build'
    needs: [tests, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            output_arch: x86_64
            artifact_name: android-emulator-x86_64
            pyside_wheel: pyside6-6.11.2-6.11.2-cp311-cp311-android_x86_64.whl
            pyside_sha256: 7dc0335592a11a612fd6a16b48b202ddd85bf0bcd2d2e3fc2d50dbb8e4f7a5fe
            shiboken_wheel: shiboken6-6.11.2-6.11.2-cp311-cp311-android_x86_64.whl
            shiboken_sha256: 642bb59b6f4654236f8cba0c2fa45dbfcca6363d83b2c1b53f245a2a7bd77530
          - arch: aarch64
            output_arch: arm64
            artifact_name: package-Android-arm64
            pyside_wheel: pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl
            pyside_sha256: c5288e0740ad91d87d4cafa16132768c149c56521bf63c83c98404b865911678
            shiboken_wheel: shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl
            shiboken_sha256: e99609b689d3df2ac97ffbe17df0ce8b1246b2c47b4d24f6fb73f1eaad4bd0f2

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.11 for Qt Android deployment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android and host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake ccache cmake libffi-dev libltdl-dev \
            libncurses5-dev libncursesw5-dev libssl-dev libtool \
            pkg-config unzip zip zlib1g-dev
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install pinned Qt Android deployment frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r amysynth_version/qt_frontend/requirements.txt \
            'PySide6==6.11.2' \
            'Cython==0.29.36'
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          import PySide6

          requirements = Path(PySide6.__file__).parent / "scripts" / "requirements-android.txt"
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "-r", str(requirements)],
              check=True,
          )
          PY

      - name: Build pinned AMY service AAR
        run: |
          git clone https://github.com/linuxificator/amy.git "$RUNNER_TEMP/amy-lb"
          git -C "$RUNNER_TEMP/amy-lb" merge-base --is-ancestor \
            "$AMY_COMMIT" "origin/$AMY_RELEASE_BRANCH"
          git -C "$RUNNER_TEMP/amy-lb" checkout "$AMY_COMMIT"
          gradle -p "$RUNNER_TEMP/amy-lb/android" \
            :amy-service:assembleDebug --stacktrace
          test "$(git -C "$RUNNER_TEMP/amy-lb" rev-parse HEAD)" = "$AMY_COMMIT"

      - name: Download verified Qt for Python Android wheels
        env:
          PYSIDE_WHEEL: ${{ matrix.pyside_wheel }}
          PYSIDE_SHA256: ${{ matrix.pyside_sha256 }}
          SHIBOKEN_WHEEL: ${{ matrix.shiboken_wheel }}
          SHIBOKEN_SHA256: ${{ matrix.shiboken_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/qt-android-wheels"
          curl -L --fail --silent --show-error \
            "https://download.qt.io/official_releases/QtForPython/pyside6/$PYSIDE_WHEEL" \
            -o "$RUNNER_TEMP/qt-android-wheels/$PYSIDE_WHEEL"
          curl -L --fail --silent --show-error \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/$SHIBOKEN_WHEEL" \
            -o "$RUNNER_TEMP/qt-android-wheels/$SHIBOKEN_WHEEL"
          echo "$PYSIDE_SHA256  $RUNNER_TEMP/qt-android-wheels/$PYSIDE_WHEEL" \
            | sha256sum --check --strict
          echo "$SHIBOKEN_SHA256  $RUNNER_TEMP/qt-android-wheels/$SHIBOKEN_WHEEL" \
            | sha256sum --check --strict

      - name: Build Qt frontend plus separate AMY service APK
        working-directory: amysynth_version/qt_frontend
        env:
          PYSIDE_WHEEL: ${{ matrix.pyside_wheel }}
          SHIBOKEN_WHEEL: ${{ matrix.shiboken_wheel }}
        run: |
          python packaging/android/build_android.py \
            --frontend "$PWD" \
            --build-dir "$RUNNER_TEMP/lb-android-${{ matrix.arch }}" \
            --aar "$RUNNER_TEMP/amy-lb/android/amy-service/build/outputs/aar/amy-service-debug.aar" \
            --wheel-pyside "$RUNNER_TEMP/qt-android-wheels/$PYSIDE_WHEEL" \
            --wheel-shiboken "$RUNNER_TEMP/qt-android-wheels/$SHIBOKEN_WHEEL" \
            --ndk "$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            --sdk "$ANDROID_SDK_ROOT" \
            --arch '${{ matrix.arch }}' \
            --release-stamp '${{ needs.release-metadata.outputs.stamp }}'

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            amysynth_version/qt_frontend/dist/*Android-${{ matrix.output_arch }}.apk
            amysynth_version/qt_frontend/dist/*Android-${{ matrix.output_arch }}.apk.sha256
          if-no-files-found: error
          retention-days: 2

  android-emulator:
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/integration/android_build'
    needs: [android-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download x86_64 Android package
        uses: actions/download-artifact@v4
        with:
          name: android-emulator-x86_64
          path: android-package

      - name: Checkout pinned AMY audio analyzer
        run: |
          git clone https://github.com/linuxificator/amy.git "$RUNNER_TEMP/amy-lb"
          git -C "$RUNNER_TEMP/amy-lb" merge-base --is-ancestor \
            "$AMY_COMMIT" "origin/$AMY_RELEASE_BRANCH"
          git -C "$RUNNER_TEMP/amy-lb" checkout "$AMY_COMMIT"
          test "$(git -C "$RUNNER_TEMP/amy-lb" rev-parse HEAD)" = "$AMY_COMMIT"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Packaged Android end-to-end smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash amysynth_version/qt_frontend/packaging/android/test_android_apk.sh

      - name: Upload Omnichord Android smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lb-omnichord-android-smoke
          path: android-audio-capture/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: [release-metadata, linux-appimages, macos-dmg, windows-native, android-packages, android-emulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all validated packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create tag and five-platform GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
        run: |
          linux_file="LB_Omnichord.${RELEASE_STAMP}.Linux-x86_64.AppImage"
          pi_file="LB_Omnichord.${RELEASE_STAMP}.RaspberryPi-aarch64.AppImage"
          mac_file="LB_Omnichord.${RELEASE_STAMP}.macOS-arm64.dmg"
          windows_file="LB_Omnichord.${RELEASE_STAMP}.Windows-x86_64.zip"
          android_file="LB_Omnichord.${RELEASE_STAMP}.Android-arm64.apk"
          {
            echo '## Linux x64'
            echo
            echo "Download \`$linux_file\` and its SHA-256 file."
            echo
            echo '## Raspberry Pi 4 / 5 (64-bit Raspberry Pi OS)'
            echo
            echo "Download \`$pi_file\` and its SHA-256 file. This Pi 4 baseline also runs on Pi 5."
            echo
            echo '## macOS Apple Silicon'
            echo
            echo "Download \`$mac_file\` and its SHA-256 file. This build is ad-hoc signed, but it is not signed with an Apple Developer ID and is not Apple-notarized. macOS therefore blocks the first normal launch by default."
            echo
            echo 'Installation:'
            echo
            echo '1. Open the DMG, drag `LB_Omnichord.app` to `Applications`, then eject the DMG.'
            echo '2. Open `Applications` in Finder and double-click `LB_Omnichord`. macOS shows a warning and blocks this first launch; dismiss the warning.'
            echo '3. Open the Apple menu, choose `System Settings`, select `Privacy & Security` in the sidebar, and scroll down to `Security`.'
            echo '4. Find the message about `LB_Omnichord` and click `Open Anyway`. This button is available for about one hour after the blocked launch attempt.'
            echo '5. Enter your Mac login password or use Touch ID if macOS asks for confirmation.'
            echo '6. When the warning appears again, click `Open`. macOS saves an exception for this app, so later launches work normally.'
            echo
            echo 'This app-specific exception is sufficient; do not disable Gatekeeper or globally weaken `Allow applications downloaded from`.'
            echo
            echo '[Apple: Open a Mac app from an unknown developer](https://support.apple.com/en-gb/guide/mac-help/mh40616/mac)'
            echo
            echo '## Windows native (experimental)'
            echo
            echo "Download \`$windows_file\` and its SHA-256 file, extract the complete zip, then double-click \`LB_Omnichord.cmd\`. Do not use Explorer's \`Run with PowerShell\` on the internal \`run_windows.ps1\`: the double-click launcher supplies a process-only execution-policy bypass and keeps startup errors visible."
            echo
            echo 'The portable directory contains separate native AMY and Qt frontend executables; it is not a single executable and the extracted files must stay together. Native Windows pointer hardware, audio and MIDI still need physical validation.'
            echo
            echo '## Android arm64 (experimental)'
            echo
            echo "Download \`$android_file\` and its SHA-256 file, allow installation from this source when Android asks, then install the APK. The package contains a PySide6 frontend and a separate private AMY/Oboe service process communicating through the app-private \`amy.sock\`."
            echo
            echo 'This package is CI debug-signed so it can be installed and emulator-tested without a repository signing secret. It is not a Play Store bundle or a stable update channel, and physical touchscreen, speaker, route-change and latency validation is still required.'
            echo
            echo '## Build provenance'
            echo
            echo "AMY fork release: \`$AMY_RELEASE_BRANCH\` at immutable build commit \`$AMY_COMMIT\`."
          } > release-notes.md
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md

  refresh-readme-screenshots:
    if: github.ref == 'refs/heads/main'
    needs: [publish-release]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements.txt

      - name: Install screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
          python -m pip install \
            -r amysynth_version/qt_frontend/requirements.txt

      - name: Capture and validate the released interface
        run: |
          python amysynth_version/qt_frontend/capture_screenshots.py
          python amysynth_version/qt_frontend/tests/test_static_contracts.py

      - name: Commit changed README screenshots and queue validation release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          screenshots=(
            amysynth_version/qt_frontend/screenshots/omni.png
            amysynth_version/qt_frontend/screenshots/midi.png
          )
          if git diff --quiet -- "${screenshots[@]}"; then
            echo 'README screenshots already match the released interface.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${screenshots[@]}"
          git commit -m 'Refresh README screenshots'
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN do not start another workflow run.
          # Dispatch explicitly so the screenshot-only commit is fully tested.
          gh workflow run desktop-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
