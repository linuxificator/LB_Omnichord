name: Temporary local AMY runtime patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/reverb-reset-and-control-safety'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reverb-reset-and-control-safety
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply local AMY runtime
        run: python tools/tmp_apply_local_amy.py
      - name: Check syntax
        run: |
          python -m py_compile \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/code/main.py
          grep -q -- '--local-amy' amysynth_version/qt_frontend/code/main.py
          grep -q 'class AmyLocalClient' amysynth_version/qt_frontend/code/amy_serial.py
          git diff --check
      - name: Commit local runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/code/main.py
          git diff --cached --check
          git commit -m 'Support in-process desktop AMY runtime'
          git push origin HEAD:feature/reverb-reset-and-control-safety
