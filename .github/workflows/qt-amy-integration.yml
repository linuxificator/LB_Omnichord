name: Qt AMY integration

on:
  push:
    branches: [main]
    paths:
      - 'amysynth_version/qt_frontend/**'
      - '.github/workflows/qt-amy-integration.yml'
  pull_request:
    paths:
      - 'amysynth_version/qt_frontend/**'
      - '.github/workflows/qt-amy-integration.yml'
  workflow_dispatch:

jobs:
  qt-amy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and Qt X11 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libxcb-cursor0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements.txt

      - name: Install frontend dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -r requirements.txt

      - name: Run Qt/AMY integration test
        working-directory: amysynth_version/qt_frontend
        run: python tests/integration/test_qt_amy.py
