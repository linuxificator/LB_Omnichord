name: Temporary filter control refactor

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-filter-control-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instrument-control-defaults
          fetch-depth: 0

      - name: Refactor native defaults and slider presentation
        run: |
          git clone --depth 1 https://github.com/shorepine/amy.git /tmp/amy-upstream
          python - <<'PY'
          from pathlib import Path

          root = Path('amysynth_version/qt_frontend')

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # -----------------------------------------------------------------
          # Generator: distinguish AMY-native patch values from UI defaults,
          # and put display units/scales in one catalogue source of truth.
          # -----------------------------------------------------------------
          gen = root / 'instruments' / 'generate_defaults.py'
          replace_once(
              gen,
              '''CONTROL_MINIMUMS: dict[str, float] = {\n    "filter_hz": 20.0,\n    "resonance": 0.51,\n    "lfo_hz": 0.01,\n    "vibrato_depth": 0.0,\n    "filter_lfo_depth": 0.0,\n    "pulse_width": 0.05,\n    "pwm_depth": 0.0,\n    "portamento_ms": 0.0,\n    "attack_ms": 0.0,\n    "decay_ms": 0.0,\n    "sustain": 0.0,\n    "release_ms": 0.0,\n    "algorithm": 1.0,\n    "feedback": 0.0,\n}\n''',
              '''CONTROL_MINIMUMS: dict[str, float] = {\n    "filter_hz": 20.0,\n    "resonance": 0.51,\n    "lfo_hz": 0.01,\n    "vibrato_depth": 0.0,\n    "filter_lfo_depth": 0.0,\n    "pulse_width": 0.05,\n    "pwm_depth": 0.0,\n    "portamento_ms": 0.0,\n    "attack_ms": 0.0,\n    "decay_ms": 0.0,\n    "sustain": 0.0,\n    "release_ms": 0.0,\n    "algorithm": 1.0,\n    "feedback": 0.0,\n}\n\n# Human-facing presentation belongs to the control definition rather than QML\n# key-specific conditionals.  Frequency controls display Hz and use a\n# logarithmic travel, matching how frequency is perceived.\nCONTROL_DISPLAY: dict[str, tuple[str, str, str]] = {\n    "filter_hz": ("VCF base", "Hz", "log"),\n    "resonance": ("Resonance", "Q", "linear"),\n    "lfo_hz": ("LFO rate", "Hz", "log"),\n    "vibrato_depth": ("Vibrato", "oct", "linear"),\n    "filter_lfo_depth": ("VCF LFO", "oct", "linear"),\n    "pulse_width": ("Pulse width", "", "linear"),\n    "pwm_depth": ("PWM depth", "", "linear"),\n    "portamento_ms": ("Portamento", "ms", "linear"),\n    "attack_ms": ("Attack", "ms", "linear"),\n    "decay_ms": ("Decay", "ms", "linear"),\n    "sustain": ("Sustain", "", "linear"),\n    "release_ms": ("Release", "ms", "linear"),\n    "algorithm": ("Algorithm", "", "linear"),\n    "feedback": ("Feedback", "", "linear"),\n}\n'''
          )

          replace_once(
              gen,
              '''    if label in {"Harpsichord 1", "Harpsichord 2"}:\n        # Keep the plucked decay, but avoid a waveform-phase click at note-on.\n        values["attack_ms"] = 20.0\n''',
              '''    if label in {"Harpsichord 1", "Harpsichord 2"}:\n        # Keep the plucked decay, but avoid a waveform-phase click at note-on.\n        values["attack_ms"] = 20.0\n        if label == "Harpsichord 1":\n            # Keep the UI default consistent with the P4 stability correction\n            # applied immediately after AMY factory patch 68 is loaded.\n            values["filter_hz"] = 16000.0\n            values["resonance"] = 4.0\n'''
          )

          replace_once(
              gen,
              '''        if engine == "Juno":\n            defaults = juno_native(patch)\n            apply_juno_musical_corrections(label, defaults)\n        elif engine == "DX7":\n            defaults = dx7_native(patch)\n            defaults.update(dx7_envelope(label))\n        else:\n            raise ValueError(f"unsupported engine {engine!r} for {synth['key']}")\n''',
              '''        if engine == "Juno":\n            native_defaults = juno_native(patch)\n            defaults = dict(native_defaults)\n            apply_juno_musical_corrections(label, defaults)\n        elif engine == "DX7":\n            native_defaults = dx7_native(patch)\n            defaults = dict(native_defaults)\n            defaults.update(dx7_envelope(label))\n        else:\n            raise ValueError(f"unsupported engine {engine!r} for {synth['key']}")\n'''
          )

          replace_once(
              gen,
              '''        for key, value in defaults.items():\n            control = controls[key]\n            control["minimum"] = CONTROL_MINIMUMS[key]\n            control["default"] = clamp(\n                value,\n                float(control["minimum"]),\n                float(control["maximum"]),\n            )\n''',
              '''        for key, value in defaults.items():\n            control = controls[key]\n            control["minimum"] = CONTROL_MINIMUMS[key]\n            minimum = float(control["minimum"])\n            maximum = float(control["maximum"])\n            native_value = native_defaults.get(key)\n            control["native_default"] = (\n                None\n                if native_value is None\n                else clamp(native_value, minimum, maximum)\n            )\n            control["default"] = clamp(value, minimum, maximum)\n            label_text, unit, scale = CONTROL_DISPLAY[key]\n            control["label"] = label_text\n            control["unit"] = unit\n            control["scale"] = scale\n'''
          )

          replace_once(
              gen,
              '''        "Native AMY factory patch values where directly mappable; "\n        "musical VCA envelope profiles/corrections documented in "\n        "README_defaults.md; UI ranges use physical control minima and no "\n        "longer expose the legacy -1 sentinel"\n''',
              '''        "Native AMY factory values are retained separately from application "\n        "defaults so unchanged native controls are not retransmitted; musical "\n        "VCA corrections are documented in README_defaults.md; frequency "\n        "controls display Hz with logarithmic slider travel"\n'''
          )

          # ---------------------------------------------------------------
          # Frontend model: SynthControl carries native/default/display data.
          # ---------------------------------------------------------------
          main = root / 'code' / 'main.py'
          replace_once(
              main,
              '''class SynthControl:\n    key: str\n    label: str\n    group: str\n    default: float\n    minimum: float\n    maximum: float\n    step: float\n    decimals: int\n''',
              '''class SynthControl:\n    key: str\n    label: str\n    group: str\n    default: float\n    native_default: float | None\n    minimum: float\n    maximum: float\n    step: float\n    decimals: int\n    unit: str\n    scale: str\n'''
          )
          replace_once(
              main,
              '''                default=float(control["default"]),\n                minimum=float(control["minimum"]),\n                maximum=float(control["maximum"]),\n                step=float(control["step"]),\n                decimals=int(control["decimals"]),\n''',
              '''                default=float(control["default"]),\n                native_default=(\n                    None\n                    if control.get("native_default") is None\n                    else float(control["native_default"])\n                ),\n                minimum=float(control["minimum"]),\n                maximum=float(control["maximum"]),\n                step=float(control["step"]),\n                decimals=int(control["decimals"]),\n                unit=str(control.get("unit", "")),\n                scale=str(control.get("scale", "linear")),\n'''
          )

          # ---------------------------------------------------------------
          # OO state: UI/preset values remain complete, engine payload is the
          # sparse set that differs from AMY's native patch state.
          # ---------------------------------------------------------------
          state = root / 'code' / 'synth_state.py'
          replace_once(
              state,
              '''                "step": control.step,\n                "decimals": control.decimals,\n            }\n''',
              '''                "step": control.step,\n                "decimals": control.decimals,\n                "unit": getattr(control, "unit", ""),\n                "scale": getattr(control, "scale", "linear"),\n            }\n'''
          )
          replace_once(
              state,
              '''    def transport_payload(self) -> dict[str, Any]:\n        arguments: list[str | float] = []\n        values = self.selected_values\n        for control in self.selected_definition.controls:\n            arguments.extend([control.key, float(values[control.key])])\n        return {\n            "name": self.selected_definition.key,\n            "params": arguments,\n        }\n''',
              '''    def transport_payload(self) -> dict[str, Any]:\n        """Return the complete engine override state for the selected patch.\n\n        The UI always has explicit numeric values, but AMY's factory patch is\n        already the source of truth for controls whose application default is\n        identical to the native patch value.  Omitting those values avoids\n        rewriting partial CtrlCoef lists such as the Juno VCF base frequency.\n        Application corrections and user/preset edits remain explicit.\n        """\n        arguments: list[str | float] = []\n        values = self.selected_values\n        for control in self.selected_definition.controls:\n            current = float(values[control.key])\n            native = getattr(control, "native_default", None)\n            if (\n                native is not None\n                and math.isclose(\n                    current,\n                    float(native),\n                    rel_tol=0.0,\n                    abs_tol=1e-9,\n                )\n            ):\n                continue\n            arguments.extend([control.key, current])\n        return {\n            "name": self.selected_definition.key,\n            "params": arguments,\n        }\n'''
          )

          # ---------------------------------------------------------------
          # Receiver: sparse params are a COMPLETE override set. Removing an
          # override requires a patch reload so the native value is restored.
          # ---------------------------------------------------------------
          amy_serial = root / 'code' / 'amy_serial.py'
          replace_once(
              amy_serial,
              '''        changed_keys = self._changed_param_keys(old_params, new_params)\n        name_changed = force_patch or self.selected_synth[role] != name\n        was_active = self._adsr_override_active.get(role, False)\n\n        if role == "strum" and name_changed:\n''',
              '''        changed_keys = self._changed_param_keys(old_params, new_params)\n        removed_keys = set(old_params) - set(new_params)\n        name_changed = force_patch or self.selected_synth[role] != name\n        was_active = self._adsr_override_active.get(role, False)\n\n        if role == "strum" and name_changed:\n'''
          )
          replace_once(
              amy_serial,
              '''        rhythm_generation: int | None = None\n        rhythm_config: dict[str, Any] | None = None\n        if role == "chord" and name_changed and self.rhythm_running:\n            rhythm_generation, rhythm_config = self._prepare_rhythm_rebuild(\n                reset_phase=False\n            )\n\n        self.selected_synth[role] = name\n        self.synth_params[role] = new_params\n        now_active = self._adsr_is_active(role)\n        self._adsr_override_active[role] = now_active\n\n        if name_changed or (was_active and not now_active):\n            self._configure_synth(role)\n        elif changed_keys:\n            self._apply_supported_params(role, changed_keys)\n''',
              '''        # Missing keys mean "return this control to the native patch".\n        # AMY has no generic per-control undo operation, so convergence in that\n        # case is a deliberate patch reload followed by the remaining sparse\n        # overrides. This keeps defaults, preset loads, UI edits and switch-back\n        # restoration on one transaction path.\n        patch_required = name_changed or bool(removed_keys)\n\n        rhythm_generation: int | None = None\n        rhythm_config: dict[str, Any] | None = None\n        if role == "chord" and patch_required and self.rhythm_running:\n            rhythm_generation, rhythm_config = self._prepare_rhythm_rebuild(\n                reset_phase=False\n            )\n\n        self.selected_synth[role] = name\n        self.synth_params[role] = new_params\n        now_active = self._adsr_is_active(role)\n        self._adsr_override_active[role] = now_active\n        patch_required = patch_required or (was_active and not now_active)\n\n        if patch_required:\n            self._configure_synth(role)\n        elif changed_keys:\n            self._apply_supported_params(role, changed_keys)\n'''
          )
          replace_once(
              amy_serial,
              '''        if role == "chord" and name_changed:\n            self._restore_manual_chord_after_patch()\n''',
              '''        if role == "chord" and patch_required:\n            self._restore_manual_chord_after_patch()\n'''
          )
          replace_once(
              amy_serial,
              '''        # The ESP32-P4 command path applies patch/parameter deltas at audio\n        # block boundaries. Before the first automatic chord after transport\n        # starts, explicitly converge synth 4 from the same stored chord state\n        # used by manual synth 3. This closes the startup/preset race observed\n        # on hardware without reloading the patch.\n''',
              '''        # Before the first automatic chord, reapply only actual engine\n        # overrides. Native AMY patch values are deliberately omitted: a Juno\n        # filter such as Chorus Vibes has a 27.365 Hz base coefficient plus note\n        # and envelope coefficients, and rewriting the base term is unnecessary.\n'''
          )

          # ---------------------------------------------------------------
          # QML: proper units after the value and logarithmic frequency travel.
          # Includes generic MIDI-note formatting for any future note control.
          # ---------------------------------------------------------------
          (root / 'gui' / 'ParameterSlider.qml').write_text(r'''import QtQuick
          import QtQuick.Controls

          Item {
              id: root

              required property var control

              property color textColor: "#102417"
              property color trackColor: "#c5d8c9"
              property color fillColor: "#426f4c"
              property color handleColor: "#f4fff5"
              property color borderColor: "#315b39"

              signal edited(string key, real value)

              function isLogScale() {
                  return String(root.control.scale || "linear") === "log"
              }

              function controlToSlider(value) {
                  var numeric = Number(value)
                  if (!isLogScale())
                      return numeric
                  var minimum = Math.max(Number(root.control.minimum), 1e-12)
                  return Math.log(Math.max(numeric, minimum))
              }

              function sliderToControl(value) {
                  return isLogScale() ? Math.exp(Number(value)) : Number(value)
              }

              function midiNoteName(value) {
                  var rounded = Math.round(Number(value))
                  var names = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"]
                  var note = ((rounded % 12) + 12) % 12
                  var octave = Math.floor(rounded / 12) - 1
                  return names[note] + octave
              }

              function formattedValue(value) {
                  var unit = String(root.control.unit || "")
                  if (unit === "note")
                      return midiNoteName(value)
                  var text = Number(value).toFixed(Number(root.control.decimals))
                  return unit.length > 0 ? text + " " + unit : text
              }

              function syncSliderValue() {
                  slider.value = controlToSlider(root.control.value)
              }

              onControlChanged: syncSliderValue()

              Text {
                  anchors.left: parent.left
                  anchors.top: parent.top
                  anchors.right: parent.right

                  text:
                      root.control.label
                      + " "
                      + root.formattedValue(
                          root.sliderToControl(slider.value)
                      )

                  color: root.textColor
                  font.pixelSize: 13
                  font.bold: true
                  elide: Text.ElideRight
              }

              Slider {
                  id: slider

                  anchors.left: parent.left
                  anchors.right: parent.right
                  anchors.bottom: parent.bottom
                  height: 28

                  from:
                      root.isLogScale()
                      ? Math.log(Math.max(Number(root.control.minimum), 1e-12))
                      : Number(root.control.minimum)
                  to:
                      root.isLogScale()
                      ? Math.log(Math.max(Number(root.control.maximum), 1e-12))
                      : Number(root.control.maximum)
                  stepSize:
                      root.isLogScale()
                      ? 0
                      : Number(root.control.step)
                  live: true

                  Component.onCompleted:
                      root.syncSliderValue()

                  onMoved:
                      root.edited(
                          root.control.key,
                          root.sliderToControl(value)
                      )

                  background: Rectangle {
                      x: slider.leftPadding
                      y:
                          slider.topPadding
                          + slider.availableHeight / 2
                          - height / 2
                      width: slider.availableWidth
                      height: 8
                      radius: 4
                      color: root.trackColor

                      Rectangle {
                          width:
                              slider.visualPosition
                              * parent.width
                          height: parent.height
                          radius: 4
                          color: root.fillColor
                      }
                  }

                  handle: Rectangle {
                      x:
                          slider.leftPadding
                          + slider.visualPosition
                          * (
                              slider.availableWidth
                              - width
                          )
                      y:
                          slider.topPadding
                          + slider.availableHeight / 2
                          - height / 2
                      width: 18
                      height: 18
                      radius: 9
                      color: root.handleColor
                      border.color: root.borderColor
                      border.width: 2
                  }
              }
          }
          ''', encoding='utf-8')

          # ---------------------------------------------------------------
          # Unit tests for OO state and catalogue semantics.
          # ---------------------------------------------------------------
          test_state = root / 'tests' / 'test_synth_state.py'
          text = test_state.read_text(encoding='utf-8')
          text = text.replace(
              '''def control(key: str, default: float, minimum: float, maximum: float):\n    return SimpleNamespace(\n        key=key,\n        label=key,\n        group="extra",\n        default=default,\n        minimum=minimum,\n        maximum=maximum,\n        step=1.0,\n        decimals=2,\n    )\n''',
              '''def control(\n    key: str,\n    default: float,\n    minimum: float,\n    maximum: float,\n    *,\n    native_default: float | None = None,\n):\n    return SimpleNamespace(\n        key=key,\n        label=key,\n        group="extra",\n        default=default,\n        native_default=(default if native_default is None else native_default),\n        minimum=minimum,\n        maximum=maximum,\n        step=1.0,\n        decimals=2,\n        unit="Hz" if key == "filter_hz" else "",\n        scale="log" if key == "filter_hz" else "linear",\n    )\n'''
          )
          text = text.replace(
              '''        self.assertEqual(\n            payload["params"],\n            ["filter_hz", 1200.0, "resonance", 2.0],\n        )\n''',
              '''        self.assertEqual(\n            payload["params"],\n            ["filter_hz", 1200.0],\n        )\n'''
          )
          text = text.replace(
              '''        self.assertEqual(\n            state.transport_payload()["params"],\n            ["filter_hz", 1350.0, "resonance", 2.0],\n        )\n''',
              '''        self.assertEqual(\n            state.transport_payload()["params"],\n            ["filter_hz", 1350.0],\n        )\n'''
          )
          insert = '''\n    def test_native_defaults_are_not_transmitted_but_app_corrections_are(self) -> None:\n        native = SimpleNamespace(\n            key="native",\n            label="native",\n            controls=(\n                control("filter_hz", 27.365, 20.0, 18000.0),\n                control("attack_ms", 20.0, 0.0, 5000.0, native_default=6.0),\n            ),\n        )\n        state = SynthState((native,), 0)\n        self.assertEqual(\n            state.transport_payload()["params"],\n            ["attack_ms", 20.0],\n        )\n        state.set_control("filter_hz", 500.0)\n        self.assertEqual(\n            state.transport_payload()["params"],\n            ["filter_hz", 500.0, "attack_ms", 20.0],\n        )\n\n'''
          marker = '\n    def test_switch_away_and_back_retains_each_instrument_values(self) -> None:\n'
          if marker not in text:
              raise SystemExit('test_synth_state insertion marker missing')
          text = text.replace(marker, insert + marker, 1)
          test_state.write_text(text, encoding='utf-8')

          # Static presentation contracts.
          static = root / 'tests' / 'test_static_contracts.py'
          text = static.read_text(encoding='utf-8')
          old = '''        self.assertIn("Number(slider.value).toFixed", qml)\n        self.assertIn("from: Number(root.control.minimum)", qml)\n        self.assertIn("to: Number(root.control.maximum)", qml)\n'''
          new = '''        self.assertIn("formattedValue", qml)\n        self.assertIn("Math.log", qml)\n        self.assertIn("Math.exp", qml)\n        self.assertIn("midiNoteName", qml)\n'''
          if old not in text:
              raise SystemExit('static QML assertions marker missing')
          text = text.replace(old, new, 1)
          static.write_text(text, encoding='utf-8')

          # Serial P7: native filter base must NOT be reasserted. A user edit
          # still updates both chord synths through the same sparse state path.
          serial = root / 'tests' / 'integration' / 'test_serial.py'
          text = serial.read_text(encoding='utf-8')
          start = text.index('    def test_preset7_rhythm_start_reasserts_chord_state_before_schedule')
          end = text.index('    def test_serial_framing_and_live_chord_patch_order', start)
          replacement = '''    def test_preset7_rhythm_start_preserves_native_filter_until_user_override(self) -> None:\n        """Fresh P7 must leave Chorus Vibes' complete native VCF model intact."""\n        chorus_index = synth_index("Chorus Vibes")\n        chorus_patch = patch_for_index(chorus_index)\n        cutoff = control_default(chorus_index, "filter_hz")\n        native_cutoff4 = f"v0F{wire_float(cutoff)}i4Z"\n\n        with HeadlessApp(native_amy=False) as app:\n            app.bridge.wait_idle(timeout=8.0)\n            app.action("selectPreset", 7)\n            app.bridge.wait_idle(timeout=8.0)\n            self.assertEqual(app.query("selectedPreset"), 7)\n            self.assertEqual(app.query("selectedChordSynthIndex"), chorus_index)\n\n            # The factory K66 command already installs F27.365 together with\n            # note/envelope tracking. The host must not rewrite that native\n            # base coefficient merely because it is visible in the UI.\n            select_lines = app.bridge.lines_since(0)\n            self.assertNotIn(native_cutoff4, select_lines)\n\n            app.action("pressChord", 0, 0)\n            app.action("releaseChord", 0, 0)\n            app.bridge.wait_idle(timeout=8.0)\n\n            start = app.bridge.count()\n            if not bool(app.query("rhythmRunning")):\n                app.action("toggleRhythm")\n            app.bridge.wait_for_lines(["zY1Z"], start=start, timeout=8.0)\n            app.bridge.wait_idle(timeout=8.0)\n            lines = app.bridge.lines_since(start)\n            self.assertNotIn(native_cutoff4, lines)\n            self.assertNotIn(f"K{chorus_patch}i4Z", lines)\n            self.assertTrue(\n                any(line.startswith("H") and "i4Z" in line for line in lines),\n                "no rhythm-chord events were scheduled",\n            )\n\n            # A real UI edit becomes an explicit engine override and is sent to\n            # both manual and rhythm chord synths.\n            edited_cutoff = max(500.0, cutoff + 250.0)\n            edited3 = f"v0F{wire_float(edited_cutoff)}i3Z"\n            edited4 = f"v0F{wire_float(edited_cutoff)}i4Z"\n            edit_start = app.bridge.count()\n            app.action("setChordSynthControl", "filter_hz", edited_cutoff)\n            edit_lines = app.bridge.wait_for_lines(\n                [edited3, edited4], start=edit_start, timeout=8.0\n            )\n            self.assertNotIn(f"K{chorus_patch}i3Z", edit_lines)\n            self.assertNotIn(f"K{chorus_patch}i4Z", edit_lines)\n\n'''
          serial.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          # Native P7: full AMY VCF state must remain unchanged and the wire
          # stream must not contain a redundant base-F command before rhythm.
          native = root / 'tests' / 'integration' / 'test_native_rhythm.py'
          text = native.read_text(encoding='utf-8')
          old = '''        cutoff4 = f"v0F{wire_float(cutoff)}i4Z"\n'''
          if old not in text:
              raise SystemExit('native cutoff marker missing')
          text = text.replace(old, '        cutoff4 = f"v0F{wire_float(cutoff)}i4Z"\n', 1)
          text = text.replace(
              '''            app.bridge.wait_for_lines(["zY1Z", cutoff4], start=start, timeout=8.0)\n''',
              '''            app.bridge.wait_for_lines(["zY1Z"], start=start, timeout=8.0)\n''',
              1,
          )
          needle = '''            after3 = app.bridge.synth_commands(3)\n            after4 = app.bridge.synth_commands(4)\n'''
          repl = '''            start_lines = app.bridge.lines_since(start)\n            self.assertNotIn(\n                cutoff4,\n                start_lines,\n                "native AMY base cutoff was redundantly rewritten at rhythm start",\n            )\n\n            after3 = app.bridge.synth_commands(3)\n            after4 = app.bridge.synth_commands(4)\n'''
          if needle not in text:
              raise SystemExit('native after marker missing')
          text = text.replace(needle, repl, 1)
          native.write_text(text, encoding='utf-8')

          # Regression catalogue: record the semantic distinction.
          use = root / 'tests' / 'USE_CASES.md'
          text = use.read_text(encoding='utf-8')
          marker = '### CTRL — slider meaning, ranges and isolation\n\n'
          addition = '''### CTRL — slider meaning, ranges and isolation\n\n**CTRL-00 — native patch value is not automatically an engine override**\n\n- A numeric UI default may represent an AMY factory-patch coefficient.\n- If the application default equals that native value, selecting a preset or starting rhythm must not retransmit it as an override.\n- Juno frequency controls are CtrlCoef models: for Chorus Vibes the factory `F27.365,0.181,,5.11,0,0` means a 27.365 Hz **base** plus note/envelope modulation, not MIDI note 27.\n- Frequency sliders display values in Hz with the unit after the number and logarithmic travel. A future MIDI-note-valued control must display note names such as C4 rather than a raw MIDI integer.\n\n**Failure history:** with factory P7/Chorus Vibes, automatic rhythm chords were effectively inaudible until Cutoff was moved. The UI/transport model was treating the visible native VCF base coefficient as an explicit override instead of leaving the complete AMY factory filter model authoritative.\n\n'''
          if marker not in text:
              raise SystemExit('USE_CASES CTRL marker missing')
