name: Temporary tagged sequencer refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/reverb-reset-and-control-safety'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reverb-reset-and-control-safety
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply tagged sequencer refactor
        run: python tools/tmp_apply_tagged_sequencer.py
      - name: Syntax and whitespace checks
        run: |
          python -m py_compile \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/code/main.py \
            amysynth_version/qt_frontend/tests/integration/test_serial.py \
            amysynth_version/qt_frontend/tests/integration/test_native_rhythm.py
          git diff --check
      - name: Commit tagged sequencer implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/code/main.py \
            amysynth_version/qt_frontend/config/amy_config.json \
            amysynth_version/qt_frontend/tests/integration/test_serial.py \
            amysynth_version/qt_frontend/tests/integration/test_native_rhythm.py \
            amysynth_version/qt_frontend/tests/USE_CASES.md
          git diff --cached --check
          git commit -m 'Use independent sequencer tag ranges'
          git push origin HEAD:feature/reverb-reset-and-control-safety
