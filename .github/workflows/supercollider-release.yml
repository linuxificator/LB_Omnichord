name: Test and release SuperCollider edition

on:
  push:
    branches: [main, release/supercollider-multiplatform]
    paths:
      - 'sc_version/**'
      - 'licence.txt'
      - '.github/workflows/supercollider-release.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish all tested SuperCollider packages
        required: true
        default: false
        type: boolean

concurrency:
  group: supercollider-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SC_VERSION: '3.14.1'
  SC_MAC_SHA256: ed264b32752d27fc86e506dd0a7eb36de7c19ebce73c3fdf2ed5514f8c73f02e
  SC_WINDOWS_SHA256: a5f95416307d35c039ca53a9f9c6151c26585064d3229521093a60dddb9458cd

jobs:
  test-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            constraints: desktop-current.txt
          - runner: ubuntu-22.04-arm
            constraints: raspberrypi-aarch64.txt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sc_version/qt_frontend/requirements*.txt
            sc_version/qt_frontend/packaging/constraints/${{ matrix.constraints }}
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl libasound2-dev libfftw3-dev libegl1 libjack-jackd2-dev libreadline-dev libsndfile1-dev ninja-build
          python -m pip install -c "sc_version/qt_frontend/packaging/constraints/${{ matrix.constraints }}" -r sc_version/qt_frontend/requirements-build.txt -r sc_version/qt_frontend/requirements-test.txt -r sc_version/qt_frontend/requirements-source.txt
      - name: Restore pinned SuperCollider runtime
        id: runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/supercollider-runtime
          key: sc-runtime-${{ runner.os }}-${{ runner.arch }}-3.14.1-${{ hashFiles('sc_version/packaging/build_supercollider_runtime.sh', 'sc_version/qt_frontend/packaging/supercollider_release_inputs.json') }}
      - name: Build pinned headless runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        env:
          OMNICHORD_SC_BUILD_ROOT: ${{ runner.temp }}/supercollider-build
          OMNICHORD_SC_INSTALL_PREFIX: ${{ runner.temp }}/supercollider-runtime
        run: sc_version/packaging/build_supercollider_runtime.sh
      - name: Run Linux and Raspberry Pi contracts
        working-directory: sc_version/qt_frontend
        run: |
          echo "${RUNNER_TEMP}/supercollider-runtime/bin" >> "$GITHUB_PATH"
          export PATH="${RUNNER_TEMP}/supercollider-runtime/bin:${PATH}"
          supernova -v | grep -F "$SC_VERSION"
          if [[ "${{ matrix.constraints }}" == "desktop-current.txt" ]]; then
            python tests/run_tests.py --suite quality
            python tests/run_tests.py --suite unit
          fi
          python tests/run_tests.py --suite portable-input-processes
          python tests/run_tests.py --suite desktop-network-discovery
          python tests/run_tests.py --suite sc-frontend
          python tests/run_tests.py --suite sc-compiler
          python tests/run_tests.py --suite sc-sequencer
          python tests/run_tests.py --suite sc-audio
          python tests/run_tests.py --suite sc-banks
          python tests/run_tests.py --suite sc-packaged
          python tests/run_tests.py --suite platform-input-linux

  test-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sc_version/qt_frontend/packaging/constraints/desktop-current.txt
      - name: Install Python dependencies
        run: python -m pip install -c sc_version/qt_frontend/packaging/constraints/desktop-current.txt -r sc_version/qt_frontend/requirements-test.txt -r sc_version/qt_frontend/requirements-source.txt
      - name: Install verified official SuperCollider runtime
        run: |
          curl -L --fail --silent --show-error "https://github.com/supercollider/supercollider/releases/download/Version-${SC_VERSION}/SuperCollider-${SC_VERSION}-macOS-universal.dmg" -o "$RUNNER_TEMP/SuperCollider.dmg"
          echo "$SC_MAC_SHA256  $RUNNER_TEMP/SuperCollider.dmg" | shasum -a 256 -c
          hdiutil attach -nobrowse "$RUNNER_TEMP/SuperCollider.dmg" -mountpoint "$RUNNER_TEMP/sc-mount"
          runtime_app="$(find "$RUNNER_TEMP/sc-mount" -maxdepth 3 -name SuperCollider.app -type d -print 2>/dev/null | head -n 1)"
          test -n "$runtime_app"
          echo "$runtime_app/Contents/MacOS" >> "$GITHUB_PATH"
          echo "$runtime_app/Contents/Resources" >> "$GITHUB_PATH"
          echo "OMNICHORD_SC_TEST_APP=$runtime_app" >> "$GITHUB_ENV"
      - name: Run macOS portable and engine contracts
        working-directory: sc_version/qt_frontend
        run: |
          sclang -v | grep -F "$SC_VERSION"
          scsynth -v | grep -F "$SC_VERSION"
          supernova -v | grep -F "$SC_VERSION"
          python tests/run_tests.py --suite portable-input-processes
          python tests/run_tests.py --suite desktop-network-discovery
          python tests/run_tests.py --suite sc-desktop-portable

  test-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sc_version/qt_frontend/packaging/constraints/desktop-current.txt
      - name: Install Python dependencies
        run: python -m pip install -c sc_version/qt_frontend/packaging/constraints/desktop-current.txt -r sc_version/qt_frontend/requirements-test.txt -r sc_version/qt_frontend/requirements-source.txt
      - name: Install verified official SuperCollider runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "SuperCollider.zip"
          Invoke-WebRequest "https://github.com/supercollider/supercollider/releases/download/Version-$env:SC_VERSION/SuperCollider-$env:SC_VERSION-win64.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SC_WINDOWS_SHA256) { throw "SuperCollider archive checksum mismatch" }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP "sc")
          $sclang = Get-ChildItem (Join-Path $env:RUNNER_TEMP "sc") -Filter sclang.exe -Recurse | Select-Object -First 1
          if (-not $sclang) { throw "sclang.exe missing from official archive" }
          $runtime = $sclang.Directory.FullName
          $runtime | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "OMNICHORD_SC_TEST_ROOT=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run Windows portable and engine contracts
        working-directory: sc_version/qt_frontend
        run: |
          sclang -v | Select-String -SimpleMatch $env:SC_VERSION
          scsynth -v | Select-String -SimpleMatch $env:SC_VERSION
          supernova -v | Select-String -SimpleMatch $env:SC_VERSION
          python tests/run_tests.py --suite portable-input-processes
          python tests/run_tests.py --suite desktop-network-discovery
          python tests/run_tests.py --suite sc-desktop-portable

  release-metadata:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-24.04
    outputs:
      stamp: ${{ steps.names.outputs.stamp }}
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - id: names
        run: |
          instant="$(date -u +%Y%m%dT%H%M%S)"
          echo "stamp=R${instant/T/}" >> "$GITHUB_OUTPUT"
          echo "tag=R${instant}-SC" >> "$GITHUB_OUTPUT"

  package-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [test-linux, test-macos, test-windows, release-metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            platform: Linux-x86_64
            constraints: desktop-current.txt
            tool_sha256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
            runtime_sha256: 1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf
          - runner: ubuntu-22.04-arm
            arch: aarch64
            platform: RaspberryPi-aarch64
            constraints: raspberrypi-aarch64.txt
            tool_sha256: 1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe
            runtime_sha256: 7d5d772b7c32f0c84caf0a452a3072a5709027d7eac5856feb89a7a7a8881372
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl libasound2-dev libfftw3-dev libegl1 libjack-jackd2-dev libreadline-dev libsndfile1-dev ninja-build patchelf
          python -m pip install -c "sc_version/qt_frontend/packaging/constraints/${{ matrix.constraints }}" -r sc_version/qt_frontend/requirements-build.txt
      - name: Restore pinned SuperCollider runtime
        id: runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/supercollider-runtime
          key: sc-runtime-${{ runner.os }}-${{ runner.arch }}-3.14.1-${{ hashFiles('sc_version/packaging/build_supercollider_runtime.sh', 'sc_version/qt_frontend/packaging/supercollider_release_inputs.json') }}
      - name: Build pinned headless runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        env:
          OMNICHORD_SC_BUILD_ROOT: ${{ runner.temp }}/supercollider-build
          OMNICHORD_SC_INSTALL_PREFIX: ${{ runner.temp }}/supercollider-runtime
        run: sc_version/packaging/build_supercollider_runtime.sh
      - name: Download verified AppImage tools
        run: |
          curl -L --fail --silent --show-error "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage" -o "$RUNNER_TEMP/appimagetool"
          echo "${{ matrix.tool_sha256 }}  $RUNNER_TEMP/appimagetool" | sha256sum --check --strict
          curl -L --fail --silent --show-error "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.arch }}" -o "$RUNNER_TEMP/appimage-runtime"
          echo "${{ matrix.runtime_sha256 }}  $RUNNER_TEMP/appimage-runtime" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Build and verify AppImage
        working-directory: sc_version/qt_frontend
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_RUNTIME_FILE: ${{ runner.temp }}/appimage-runtime
          OMNICHORD_SC_RUNTIME_PREFIX: ${{ runner.temp }}/supercollider-runtime
          OMNICHORD_SC_APPIMAGE_ARCH: ${{ matrix.arch }}
          OMNICHORD_SC_APPIMAGE_PLATFORM: ${{ matrix.platform }}
          OMNICHORD_RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          packaging/build_sc_appimage.sh
          package="dist/LB_Omnichord.SC.${OMNICHORD_RELEASE_STAMP}.${{ matrix.platform }}.AppImage"
          "$package" --verify-package
          (cd dist && sha256sum "$(basename "$package")" > "$(basename "$package").sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-SC-${{ matrix.platform }}
          path: sc_version/qt_frontend/dist/LB_Omnichord.SC.*
          if-no-files-found: error

  package-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [test-linux, test-macos, test-windows, release-metadata]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c sc_version/qt_frontend/packaging/constraints/desktop-current.txt -r sc_version/qt_frontend/requirements-build.txt
      - name: Mount verified official runtime
        run: |
          curl -L --fail --silent --show-error "https://github.com/supercollider/supercollider/releases/download/Version-${SC_VERSION}/SuperCollider-${SC_VERSION}-macOS-universal.dmg" -o "$RUNNER_TEMP/SuperCollider.dmg"
          echo "$SC_MAC_SHA256  $RUNNER_TEMP/SuperCollider.dmg" | shasum -a 256 -c
          hdiutil attach -nobrowse "$RUNNER_TEMP/SuperCollider.dmg" -mountpoint "$RUNNER_TEMP/sc-mount"
          runtime_app="$(find "$RUNNER_TEMP/sc-mount" -maxdepth 3 -name SuperCollider.app -type d -print 2>/dev/null | head -n 1)"
          test -n "$runtime_app"
          echo "OMNICHORD_SC_RUNTIME_APP=$runtime_app" >> "$GITHUB_ENV"
      - name: Build macOS DMG
        working-directory: sc_version/qt_frontend
        env:
          OMNICHORD_RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
        run: packaging/build_macos_dmg.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-SC-macOS-arm64
          path: sc_version/qt_frontend/dist/LB_Omnichord.SC.*
          if-no-files-found: error

  package-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [test-linux, test-macos, test-windows, release-metadata]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c sc_version/qt_frontend/packaging/constraints/desktop-current.txt -r sc_version/qt_frontend/requirements-build.txt
      - name: Extract verified official runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "SuperCollider.zip"
          Invoke-WebRequest "https://github.com/supercollider/supercollider/releases/download/Version-$env:SC_VERSION/SuperCollider-$env:SC_VERSION-win64.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SC_WINDOWS_SHA256) { throw "SuperCollider archive checksum mismatch" }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP "sc")
          $sclang = Get-ChildItem (Join-Path $env:RUNNER_TEMP "sc") -Filter sclang.exe -Recurse | Select-Object -First 1
          "OMNICHORD_SC_RUNTIME_ROOT=$($sclang.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows ZIP
        working-directory: sc_version/qt_frontend
        env:
          OMNICHORD_RELEASE_STAMP: ${{ needs.release-metadata.outputs.stamp }}
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-SC-Windows-x86_64
          path: sc_version/qt_frontend/dist/LB_Omnichord.SC.*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [release-metadata, package-linux, package-macos, package-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-SC-*
          path: dist
          merge-multiple: true
      - name: Publish complete SuperCollider release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -ge 8
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes 'LB Omnichord SuperCollider edition for Linux x86_64, Raspberry Pi aarch64, macOS arm64 and Windows x86_64. The verified VSCO 2 CE sample repository is installed on first launch. Android is not part of this release.'
