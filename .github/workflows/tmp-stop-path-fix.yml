name: One-shot stop-path repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'amysynth_version/qt_frontend/tests/tmp_fix_stop_path.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/reverb-reset-and-control-safety'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reverb-reset-and-control-safety
          fetch-depth: 0

      - name: Apply stop-path repair
        run: python amysynth_version/qt_frontend/tests/tmp_fix_stop_path.py

      - name: Validate syntax
        run: |
          python -m py_compile \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/tests/integration/test_serial.py \
            amysynth_version/qt_frontend/tests/test_static_contracts.py
          git diff --check

      - name: Commit repair and remove one-shot helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/tests/integration/test_serial.py \
            amysynth_version/qt_frontend/tests/test_static_contracts.py \
            amysynth_version/qt_frontend/tests/USE_CASES.md
          git rm -- \
            amysynth_version/qt_frontend/tests/tmp_fix_stop_path.py \
            .github/workflows/tmp-stop-path-fix.yml
          git commit -m 'Fix rhythm stop cleanup and transport state'
          git push origin HEAD:feature/reverb-reset-and-control-safety
