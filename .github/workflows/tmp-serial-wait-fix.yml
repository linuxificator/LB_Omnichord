name: One-shot serial wait repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/tmp_fix_serial_wait.py'
      - '.github/workflows/tmp-serial-wait-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/reverb-reset-and-control-safety'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reverb-reset-and-control-safety
          fetch-depth: 0
      - name: Repair deterministic serial wait
        run: python .github/tmp_fix_serial_wait.py
      - name: Validate serial test syntax
        run: |
          python -m py_compile amysynth_version/qt_frontend/tests/integration/test_serial.py
          git diff --check
      - name: Commit and remove one-shot files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- amysynth_version/qt_frontend/tests/integration/test_serial.py
          git rm -- .github/tmp_fix_serial_wait.py .github/workflows/tmp-serial-wait-fix.yml
          git commit -m 'Make bass tag regression wait for UART output'
          git push origin HEAD:feature/reverb-reset-and-control-safety
