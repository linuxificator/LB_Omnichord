name: Embed original tuba watermark once

on:
  push:
    branches:
      - refactor/amy-qt-frontend-layout

permissions:
  contents: write

jobs:
  embed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/amy-qt-frontend-layout

      - name: Restore original artwork and embed exact PNG bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          ROOT='amysynth_version/qt_frontend'
          ORIGINAL_QML="$ROOT/InstrumentWatermarks.qml"
          TARGET_QML="$ROOT/gui/InstrumentWatermarks.qml"
          ORIGINAL_PNG="$ROOT/tuba_watermark.png"

          git show origin/main:"$ORIGINAL_QML" > /tmp/InstrumentWatermarks.qml
          git show origin/main:"$ORIGINAL_PNG" > /tmp/tuba_watermark.png

          python3 - <<'PY'
          from pathlib import Path
          import base64

          qml = Path('/tmp/InstrumentWatermarks.qml').read_text(encoding='utf-8')
          png = Path('/tmp/tuba_watermark.png').read_bytes()
          encoded = base64.b64encode(png).decode('ascii')

          old = 'source: "tuba_watermark.png"'
          new = 'source: "data:image/png;base64,' + encoded + '"'
          if qml.count(old) != 1:
              raise SystemExit(f'Expected exactly one original tuba source, got {qml.count(old)}')

          qml = qml.replace(old, new)
          target = Path('amysynth_version/qt_frontend/gui/InstrumentWatermarks.qml')
          target.write_text(qml, encoding='utf-8')
          PY

          rm -f "$ROOT/gui/TubaWatermark.qml"
          rm -f .github/workflows/embed-tuba-once.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET_QML"
          git rm -f --ignore-unmatch "$ROOT/gui/TubaWatermark.qml"
          git rm -f -- .github/workflows/embed-tuba-once.yml
          git commit -m 'Preserve exact tuba watermark as embedded QML data'
          git push origin HEAD:refactor/amy-qt-frontend-layout
