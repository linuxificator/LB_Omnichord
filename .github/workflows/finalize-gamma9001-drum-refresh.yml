name: Finalize Gamma9001 drum refresh

on:
  push:
    branches:
      - feature/gamma9001-drum-pattern-refresh
    paths:
      - '.github/workflows/finalize-gamma9001-drum-refresh.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/gamma9001-drum-pattern-refresh
          fetch-depth: 1

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            amysynth_version/qt_frontend/requirements.txt
            amysynth_version/qt_frontend/requirements-portable.txt
            amysynth_version/qt_frontend/requirements-test.txt
            amysynth_version/qt_frontend/packaging/constraints/desktop-current.txt

      - name: Verify and materialize reviewed payload
        run: |
          python amysynth_version/design/rhythm_rework/new_patterns/materialize_gamma9001_drum_refresh.py --check
          python amysynth_version/design/rhythm_rework/new_patterns/materialize_gamma9001_drum_refresh.py

      - name: Normalize final metadata and provenance
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          rel = 'amysynth_version/qt_frontend/music/drums/drum_activity_timing.json'
          activity_path = Path(rel)
          manifest_path = Path('amysynth_version/design/rhythm_rework/new_patterns/canonical_drum_data_manifest.json')
          provenance_path = Path('amysynth_version/qt_frontend/music/catalogue_provenance.json')

          activity = json.loads(activity_path.read_text(encoding='utf-8'))
          baseline = json.loads(subprocess.check_output(['git', 'show', f'origin/main:{rel}'], text=True))
          current_by_id = {item['id']: item for item in activity['rhythms']}
          baseline_by_id = {item['id']: item for item in baseline['rhythms']}
          if set(current_by_id) != set(baseline_by_id) or len(current_by_id) != 54:
              raise SystemExit('drum rhythm coverage differs from current main')

          fields = ('meter', 'period_bars', 'period_ticks')
          differences = {
              rhythm_id: {
                  field: (current_by_id[rhythm_id][field], baseline_by_id[rhythm_id][field])
                  for field in fields
                  if current_by_id[rhythm_id][field] != baseline_by_id[rhythm_id][field]
              }
              for rhythm_id in current_by_id
          }
          differences = {key: value for key, value in differences.items() if value}
          expected = {
              'disco', 'eleven_eight', 'five_four', 'house', 'nine_eight',
              'samba', 'seven_eight', 'seven_four_funk', 'techno', 'trance',
          }
          if set(differences) != expected:
              raise SystemExit(f'unexpected cycle metadata changes: {sorted(differences)}')

          samba = current_by_id['samba']
          if (samba['meter'], int(samba['period_bars']), int(samba['period_ticks'])) != ('2/4', 2, 384):
              raise SystemExit('unexpected staged Samba metadata')
          samba['meter'] = '4/4'
          samba['period_bars'] = 1

          max_events = 0
          max_locations = []
          for rhythm in activity['rhythms']:
              numerator, denominator = (int(value) for value in rhythm['meter'].split('/', 1))
              bar_ticks = 96 * 4 * numerator // denominator
              if int(rhythm['period_ticks']) != int(rhythm['period_bars']) * bar_ticks:
                  raise SystemExit(f'{rhythm["id"]}: inconsistent meter/period metadata')
              if len(rhythm['levels']) != 5:
                  raise SystemExit(f'{rhythm["id"]}: expected five levels')
              previous = set()
              for level_number, level in enumerate(rhythm['levels'], start=1):
                  if int(level['level']) != level_number:
                      raise SystemExit(f'{rhythm["id"]}: level numbering changed')
                  events = level['events']
                  if int(level['event_count']) != len(events):
                      raise SystemExit(f'{rhythm["id"]}: stale event_count')
                  if len(events) > 56:
                      raise SystemExit(f'{rhythm["id"]} level {level_number}: exceeds 56 events')
                  if level_number == 1:
                      if len(events) < 5 or len({str(event['role']) for event in events}) < 2:
                          raise SystemExit(f'{rhythm["id"]}: foundation is too sparse')
                  locations = {(int(event['tick']), str(event['role'])) for event in events}
                  if not previous <= locations:
                      raise SystemExit(f'{rhythm["id"]} level {level_number}: not cumulative')
                  previous = locations
                  for event in events:
                      tick = int(event['tick'])
                      velocity = int(event['velocity'])
                      if tick < 0 or tick >= int(rhythm['period_ticks']) or tick % 2:
                          raise SystemExit(f'{rhythm["id"]}: invalid tick {tick}')
                      if not 1 <= velocity <= 127:
                          raise SystemExit(f'{rhythm["id"]}: invalid velocity {velocity}')
                      if {'preset', 'sample', 'midi_note', 'patch', 'note'} & set(event):
                          raise SystemExit(f'{rhythm["id"]}: concrete kit data in timing')
                  if len(events) > max_events:
                      max_events = len(events)
                      max_locations = [(rhythm['id'], level_number)]
                  elif len(events) == max_events:
                      max_locations.append((rhythm['id'], level_number))

          activity['coverage_summary'] = {
              'rhythm_count': 54,
              'levels_per_rhythm': 5,
              'max_event_count': max_events,
              'max_event_locations': [
                  {'rhythm_id': rhythm_id, 'level': level, 'event_count': max_events}
                  for rhythm_id, level in max_locations
              ],
          }
          activity['repository_contract']['branch'] = 'feature/gamma9001-drum-pattern-refresh'
          activity['repository_contract']['commit_read'] = subprocess.check_output(
              ['git', 'rev-parse', 'origin/main'], text=True
          ).strip()
          activity['repository_contract']['design_status'] = (
              'canonical runtime activity catalogue; Gamma9001 quality refresh 2026-09-05'
          )
          activity['design_contract']['cycle_length_policy'] = (
              'A repeating groove may use a one-bar period when musically complete, avoiding duplicated '
              'identical onsets used only to fill an older two-bar storage period. This preserves richer '
              'complete activity levels within the 56-event sequencer limit; fills remain separate.'
          )

          encoded = (json.dumps(activity, indent=2) + '\n').encode('utf-8')
          canonical_sha = hashlib.sha256(encoded).hexdigest()
          activity_path.write_bytes(encoded)

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if int(manifest.get('manifest_revision', 0)) != 1:
              raise SystemExit('canonical drum manifest format revision changed unexpectedly')
          for entry in manifest['files']:
              if entry['name'] == 'drum_activity_timing.json':
                  entry['sha256'] = canonical_sha
                  break
          else:
              raise SystemExit('manifest lacks drum_activity_timing.json')
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          provenance = json.loads(provenance_path.read_text(encoding='utf-8'))
          provenance['recorded'] = '2026-09-05'
          for entry in provenance['catalogues']:
              if entry['path'] == 'music/drums/drum_activity_timing.json':
                  entry['sha256'] = canonical_sha
                  entry['process'] = (
                      'LB-authored 2026-09-05 genre-convention refresh; Gamma9001 is the musical '
                      'reference while timing remains kit-independent; musically complete one-bar '
                      'cycles are used for selected repetitive styles/odd meters to remain within '
                      'the 56-event sequencer limit without duplicating identical onsets; Samba '
                      'metadata is normalized to one 4/4 bar without changing its 384-tick groove'
                  )
                  break
          else:
              raise SystemExit('provenance lacks drum activity entry')
          provenance_path.write_text(json.dumps(provenance, indent=2) + '\n', encoding='utf-8')
          print('FINAL_DRUM_ACTIVITY_SHA256', canonical_sha)
          print('MAX_EVENT_COUNT', max_events)
          PY

      - name: Add foundation richness regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('amysynth_version/qt_frontend/tests/test_drum_patterns.py')
          text = p.read_text(encoding='utf-8')
          method = '''    def test_foundation_levels_are_musically_usable(self) -> None:\n        for rhythm in self.catalog.rhythms.values():\n            foundation = rhythm.levels[0]\n            self.assertGreaterEqual(len(foundation), 5, rhythm.rhythm_id)\n            self.assertGreaterEqual(\n                len({event.role for event in foundation}),\n                2,\n                rhythm.rhythm_id,\n            )\n\n'''
          marker = '    def test_activity_levels_are_selected_complete_not_concatenated(self) -> None:\n'
          if 'def test_foundation_levels_are_musically_usable' not in text:
              if marker not in text:
                  raise SystemExit('test insertion marker not found')
              p.write_text(text.replace(marker, method + marker, 1), encoding='utf-8')
          PY

      - name: Install exact frontend test dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -c packaging/constraints/desktop-current.txt -r requirements-test.txt

      - name: Run targeted drum and provenance tests
        working-directory: amysynth_version/qt_frontend
        run: |
          python tests/test_drum_patterns.py
          python tests/test_catalogue_provenance.py

      - name: Run maintained unit suite
        working-directory: amysynth_version/qt_frontend
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/amysynth_version/qt_frontend/tests/alsa-null.conf
          OMNICHORD_TEST_ARTIFACT_DIR: test-artifacts
        run: python tests/run_tests.py --suite unit --coverage

      - name: Record completion evidence
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          activity = Path('amysynth_version/qt_frontend/music/drums/drum_activity_timing.json')
          sha = hashlib.sha256(activity.read_bytes()).hexdigest()
          p = Path('amysynth_version/design/rhythm_rework/new_patterns/CODEX_HANDOVER_GAMMA9001_DRUM_PATTERN_REFRESH.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Status: **data authored and validated; materialization into the canonical runtime JSON is the next bounded step**  ',
              'Status: **canonical runtime data materialized; targeted drum/provenance tests and maintained unit suite passed**  ',
              1,
          )
          old = 'Decoded canonical JSON SHA-256:\n\n`e7d3e14374d90a290fc19fa6f202c0776cccc299ce301b68fdc96af40877f0fc`'
          new = ('Staged payload JSON SHA-256 (before Samba metadata normalization):\n\n'
                 '`e7d3e14374d90a290fc19fa6f202c0776cccc299ce301b68fdc96af40877f0fc`\n\n'
                 'Final canonical runtime JSON SHA-256:\n\n`' + sha + '`')
          text = text.replace(old, new, 1)
          marker = '\n## 13. Definition of done\n'
          evidence = f'''\n## 12a. Integration validation evidence\n\nThe staged payload was SHA-verified and materialized. Nine repetitive/electronic/odd-meter rhythms intentionally use a musically complete one-bar period rather than duplicating the same onset definitions into an older two-bar storage period; this permits richer level-4/5 grooves while remaining within the 56-event sequencer limit. Samba's unchanged 384-tick groove is represented as the equivalent one 4/4 bar so the existing 4/4 fill scheduler retains legal beat positions. No fill timing, kit mapping, transport code or AMY architecture was changed. The canonical drum manifest remains format revision 1 because only catalogue content/hash metadata changed.\n\nFinal canonical `drum_activity_timing.json` SHA-256: `{sha}`.\n\nValidation executed before commit:\n\n- staged payload SHA and structural validator: passed;\n- all 54 meter/period relationships checked at 96 PPQ;\n- all five levels remain cumulative and <=56 events;\n- every level-1 foundation has >=5 events and >=2 logical roles;\n- no timing event contains concrete kit data;\n- `tests/test_drum_patterns.py`: passed;\n- `tests/test_catalogue_provenance.py`: passed;\n- official-CI-equivalent unit environment (`libegl1`, pinned desktop constraints): `python tests/run_tests.py --suite unit --coverage` passed.\n\nThe temporary transfer payload, materializer and one-shot workflows are removed immediately after this validated commit, leaving `qt_frontend/music/drums/drum_activity_timing.json` as the single runtime authority.\n'''
          if '## 12a. Integration validation evidence' not in text:
              text = text.replace(marker, evidence + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit canonical data and regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            amysynth_version/qt_frontend/music/drums/drum_activity_timing.json \
            amysynth_version/qt_frontend/music/catalogue_provenance.json \
            amysynth_version/qt_frontend/tests/test_drum_patterns.py \
            amysynth_version/design/rhythm_rework/new_patterns/canonical_drum_data_manifest.json \
            amysynth_version/design/rhythm_rework/new_patterns/CODEX_HANDOVER_GAMMA9001_DRUM_PATTERN_REFRESH.md
          git diff --cached --check
          git commit -m 'Materialize richer Gamma9001 drum activity catalogue'
          git push origin HEAD:feature/gamma9001-drum-pattern-refresh

# retry after keeping manifest format revision stable
