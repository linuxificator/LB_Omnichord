name: ESP32-P4 firmware build

on:
  workflow_call:
    inputs:
      profile:
        description: ESP32-P4 silicon ABI profile
        required: false
        type: string
        default: v1
  pull_request:
    branches: [main]
    paths:
      - 'amysynth_version/esp32p4/**'
      - 'amysynth_version/qt_frontend/packaging/release_inputs.json'
      - '.github/workflows/esp32p4-build.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Silicon ABI profile (v1 includes the observed v1.3 board)
        required: true
        type: choice
        options: [v1, v3, all]
        default: v1

concurrency:
  group: esp32p4-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((github.event_name == 'pull_request' || inputs.profile == 'all') && '["v1","v3"]' || format('["{0}"]', inputs.profile || 'v1')) }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Load exact release inputs
        run: >-
          python3 amysynth_version/qt_frontend/packaging/release_inputs.py
          github-env --output "$GITHUB_ENV"

      - name: Verify firmware source contract
        run: python3 amysynth_version/esp32p4/tests/test_firmware_contract.py

      - name: Build ${{ matrix.profile }} image with ESP-IDF 6.0.2
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1 branch, verified 2026-09-01
        with:
          esp_idf_version: v6.0.2
          target: esp32p4
          path: amysynth_version/esp32p4
          command: bash build_firmware.sh --profile ${{ matrix.profile }}

      - name: Validate and package portable flash image
        shell: bash
        run: >-
          amysynth_version/esp32p4/package_firmware.sh
          '${{ matrix.profile }}'
          'amysynth_version/esp32p4/ci-flash/${{ matrix.profile }}'

      - name: Validate local flash helper
        shell: bash
        run: bash -n amysynth_version/esp32p4/flash_ci.sh

      - name: Upload portable ${{ matrix.profile }} firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esp32p4-firmware-${{ matrix.profile }}
          path: amysynth_version/esp32p4/ci-flash/${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 14
