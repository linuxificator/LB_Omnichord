name: ESP32-P4 firmware build

on:
  pull_request:
    branches: [main]
    paths:
      - 'amysynth_version/esp32p4/**'
      - '.github/workflows/esp32p4-build.yml'
  push:
    branches: [main]
    paths:
      - 'amysynth_version/esp32p4/**'
      - '.github/workflows/esp32p4-build.yml'
  workflow_dispatch:

concurrency:
  group: esp32p4-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AMY_REPO: https://github.com/linuxificator/amy.git
  AMY_RELEASE_BRANCH: releases/amy_omnichord_R20260830T220021
  AMY_REF: 32f3a68861a68979ceb715cf32e0322e8614365b

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          # For pull requests, build the branch head rather than GitHub's
          # synthetic merge commit. This makes the artifact match the exact
          # commit a local `git pull` checks out.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build with ESP-IDF 6.0.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32p4
          path: amysynth_version/esp32p4
          # idf.py runs merge-bin with the build directory as cwd, so the
          # output path here is relative to build/ already.
          command: bash prepare_amy.sh && idf.py build && idf.py merge-bin -o merged-flash.bin -f raw

      - name: Assemble portable flash package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          project=amysynth_version/esp32p4
          build="$project/build"
          package="$project/ci-flash"
          source_sha="$(git rev-parse HEAD)"

          rm -rf "$package"
          mkdir -p "$package/bootloader" "$package/partition_table"

          cp "$build/amy_p4_test.bin" "$package/"
          cp "$build/amy_p4_test.elf" "$package/"
          cp "$build/amy_p4_test.map" "$package/"
          cp "$build/bootloader/bootloader.bin" "$package/bootloader/"
          cp "$build/partition_table/partition-table.bin" "$package/partition_table/"
          cp "$build/flash_project_args" "$package/"
          cp "$build/flash_app_args" "$package/"
          cp "$build/flash_bootloader_args" "$package/"
          cp "$build/flasher_args.json" "$package/"
          cp "$build/merged-flash.bin" "$package/"

          # Keep the legacy name as well because older instructions used it.
          if [[ -f "$build/flash_args" ]]; then
            cp "$build/flash_args" "$package/"
          fi

          cat > "$package/BUILD_INFO" <<EOF
          repository=${GITHUB_REPOSITORY}
          commit=${source_sha}
          workflow_run=${GITHUB_RUN_ID}
          esp_idf=v6.0.2
          target=esp32p4
          EOF

          # The argument file must be usable from the artifact root.
          (
            cd "$package"
            test -f amy_p4_test.bin
            test -f bootloader/bootloader.bin
            test -f partition_table/partition-table.bin
            test -f flash_project_args
            test -f flasher_args.json
            test -f merged-flash.bin
            grep -q 'amy_p4_test.bin' flash_project_args
            grep -q 'bootloader/bootloader.bin' flash_project_args
            grep -q 'partition_table/partition-table.bin' flash_project_args
          )

      - name: Validate local flash helper
        if: success()
        shell: bash
        run: bash -n amysynth_version/esp32p4/flash_ci.sh

      - name: Upload portable firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32p4-firmware
          path: amysynth_version/esp32p4/ci-flash/
          if-no-files-found: error
          retention-days: 14
