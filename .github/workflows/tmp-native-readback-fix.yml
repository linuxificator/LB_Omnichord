name: Temporary native readback fix

on:
  pull_request:
    paths:
      - 'amysynth_version/qt_frontend/tests/integration/harness.py'
      - '.github/workflows/tmp-native-readback-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instrument-control-defaults
      - name: Use typed C API for synth readback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('amysynth_version/qt_frontend/tests/integration/harness.py')
          s = p.read_text(encoding='utf-8')
          old = '''        assert self.amy is not None\n        with self._amy_lock:\n            result = list(self.amy.get_synth_commands(int(synth), False))\n'''
          new = '''        assert self.c_amy is not None\n        with self._amy_lock:\n            # The high-level amy.get_synth_commands wrapper is a replayable\n            # text blob.  The C API returns the typed list of individual wire\n            # commands, which is what state comparisons need.\n            result = list(self.c_amy.get_synth_commands(int(synth), False))\n'''
          if old not in s:
              raise SystemExit('native readback anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add amysynth_version/qt_frontend/tests/integration/harness.py
          git commit -m 'Use typed AMY synth readback in tests'
          git push origin HEAD:feature/instrument-control-defaults
