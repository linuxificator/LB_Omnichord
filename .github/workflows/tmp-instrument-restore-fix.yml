name: Temporary instrument restore validation

on:
  pull_request:
    paths:
      - 'amysynth_version/qt_frontend/code/main.py'
      - 'amysynth_version/qt_frontend/code/amy_serial.py'
      - 'amysynth_version/qt_frontend/tests/test_instrument_defaults.py'
      - '.github/workflows/tmp-instrument-restore-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instrument-control-defaults

      - name: Patch atomic instrument restore
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('amysynth_version/qt_frontend/code/main.py')
          s = main.read_text(encoding='utf-8')
          old = '''    def _send_synth_state(self, role: SynthRole) -> None:\n        self._send_synth_name(role)\n        self._send_synth_params(role)\n'''
          new = '''    def _send_synth_state(self, role: SynthRole) -> None:\n        # Instrument selection and its complete stored slider state are one\n        # logical operation.  Sending them separately allowed a patch reload\n        # to be observed without its restored per-instrument controls.\n        runtime = self._runtime(role)\n        synth = self._selected_synth(role)\n        values = runtime.values_by_synth[runtime.selected_index]\n\n        arguments: list[str | float] = []\n        for control in synth.controls:\n            arguments.extend(\n                [control.key, float(values[control.key])]\n            )\n\n        if role == "chord":\n            address = self._chord_synth_address\n        elif role == "strum":\n            address = self._strum_synth_address\n        else:\n            address = self._bass_synth_address\n\n        self._client.send_message(\n            address,\n            {\n                "name": synth.key,\n                "params": arguments,\n            },\n        )\n'''
          if old not in s:
              raise SystemExit('main synth-state anchor missing')
          s = s.replace(old, new, 1)
          compile(s, str(main), 'exec')
          main.write_text(s, encoding='utf-8')

          serial = Path('amysynth_version/qt_frontend/code/amy_serial.py')
          s = serial.read_text(encoding='utf-8')

          old = '''    def _configure_synth(self, role: str) -> None:\n        for synth in self._role_synth_ids(role):\n            self._configure_one_synth(role, synth)\n        self._apply_supported_params(role)\n'''
          new = '''    def _configure_synth(self, role: str) -> None:\n        # Keep each patch load and its complete parameter restore adjacent in\n        # the AMY command stream.  This is especially important for chord,\n        # which owns both the manual and rhythm synth instances.\n        for synth in self._role_synth_ids(role):\n            self._configure_one_synth(role, synth)\n            for command in self._param_commands_for_synth(role, synth):\n                self._wire(command)\n'''
          if old not in s:
              raise SystemExit('configure-synth anchor missing')
          s = s.replace(old, new, 1)

          anchor = '''    def _set_synth_name(self, role: str, name: str) -> None:\n'''
          method = '''    def _set_synth_state(self, role: str, state: Any) -> None:\n        """Select an instrument and restore its full slider state atomically."""\n        if not isinstance(state, dict):\n            self._set_synth_name(role, str(state))\n            return\n\n        name = str(state.get("name", ""))\n        if role == "strum":\n            self._cancel_strum_tail()\n            self._wire(f"l0i{self.synth_id['strum']}Z")\n        if name not in self.patch_map:\n            print(f"AMY warning: refusing unknown synth {name!r}", flush=True)\n            return\n\n        params = self._params_from_list(state.get("params", []))\n        self.selected_synth[role] = name\n        self.synth_params[role] = params\n        self._adsr_override_active[role] = self._adsr_is_active(role)\n\n        # _configure_synth loads each K patch and immediately follows it with\n        # the complete state above, so returning to a previously edited\n        # instrument cannot leave AMY at its factory slider values.\n        self._configure_synth(role)\n\n        if role == "chord" and self._manual_active_id is not None:\n            for note in self._manual_active_notes:\n                self._wire(\n                    f"n{self._f(note)}l1i{self.synth_id['manual_chord']}Z"\n                )\n\n'''
          if anchor not in s:
              raise SystemExit('set-synth-name anchor missing')
          if 'def _set_synth_state(' not in s:
              s = s.replace(anchor, method + anchor, 1)

          for role in ('chord', 'strum', 'bass'):
              old = f'''        elif address == a["{role}_synth"]:\n            self._set_synth_name("{role}", str(value))\n'''
              new = f'''        elif address == a["{role}_synth"]:\n            if isinstance(value, dict):\n                self._set_synth_state("{role}", value)\n            else:\n                self._set_synth_name("{role}", str(value))\n'''
              if old not in s:
                  raise SystemExit(f'{role} synth dispatch anchor missing')
              s = s.replace(old, new, 1)

          compile(s, str(serial), 'exec')
          serial.write_text(s, encoding='utf-8')
          PY

      - name: Add restore regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('amysynth_version/qt_frontend/tests/test_instrument_defaults.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          tests = '''\n    def test_atomic_instrument_state_restores_edited_resonance(self) -> None:\n        client = object.__new__(AmySerialClient)\n        client.patch_map = {"juno_050": 50}\n        client.selected_synth = {"chord": "juno_000"}\n        client.synth_params = {"chord": {"resonance": 0.93}}\n        client._adsr_override_active = {"chord": False}\n        client.synth_id = {\n            "strum": 2, "manual_chord": 3, "rhythm_chord": 4\n        }\n        client._manual_active_id = None\n        client._manual_active_notes = []\n\n        configured: list[tuple[str, dict[str, float]]] = []\n        client._configure_synth = lambda role: configured.append(\n            (role, dict(client.synth_params[role]))\n        )\n\n        AmySerialClient._set_synth_state(\n            client,\n            "chord",\n            {\n                "name": "juno_050",\n                "params": [\n                    "filter_hz", 8999.7,\n                    "resonance", 7.5,\n                    "attack_ms", 0.0,\n                    "decay_ms", 0.0,\n                    "sustain", 1.0,\n                    "release_ms", 0.0,\n                ],\n            },\n        )\n\n        self.assertEqual(client.selected_synth["chord"], "juno_050")\n        self.assertEqual(client.synth_params["chord"]["resonance"], 7.5)\n        self.assertEqual(configured, [("chord", client.synth_params["chord"])])\n\n    def test_chord_patch_and_restore_commands_are_adjacent_per_synth(self) -> None:\n        client = object.__new__(AmySerialClient)\n        emitted: list[str] = []\n        client._role_synth_ids = lambda role: (3, 4)\n        client._configure_one_synth = (\n            lambda role, synth: emitted.append(f"K:{synth}")\n        )\n        client._param_commands_for_synth = (\n            lambda role, synth: [f"R7.5:{synth}"]\n        )\n        client._wire = emitted.append\n\n        AmySerialClient._configure_synth(client, "chord")\n\n        self.assertEqual(\n            emitted,\n            ["K:3", "R7.5:3", "K:4", "R7.5:4"],\n        )\n'''
          if 'test_atomic_instrument_state_restores_edited_resonance' not in s:
              if anchor not in s:
                  raise SystemExit('test-file end anchor missing')
              s = s.replace(anchor, '\n' + tests + anchor, 1)
          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install minimal PySide runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements.txt

      - name: Install frontend dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -r requirements.txt

      - name: Run instrument state tests
        working-directory: amysynth_version/qt_frontend
        run: python tests/test_instrument_defaults.py

      - name: Verify syntax
        run: |
          python -m py_compile \
            amysynth_version/qt_frontend/code/main.py \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/tests/test_instrument_defaults.py

      - name: Commit tested fix
        run: |
          if git diff --quiet -- \
            amysynth_version/qt_frontend/code/main.py \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/tests/test_instrument_defaults.py; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            amysynth_version/qt_frontend/code/main.py \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/tests/test_instrument_defaults.py
          git commit -m 'Restore instrument slider state atomically'
          git push origin HEAD:feature/instrument-control-defaults
