name: Temporary four-bus isolation patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/reverb-reset-and-control-safety'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reverb-reset-and-control-safety
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply four-bus isolation
        run: python amysynth_version/qt_frontend/tests/tmp_apply_bus_isolation.py
      - name: Validate transformed files
        run: |
          python -m py_compile \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/tests/test_static_contracts.py \
            amysynth_version/qt_frontend/tests/integration/test_serial.py \
            amysynth_version/qt_frontend/tests/integration/test_native_controls.py
          python -m json.tool amysynth_version/qt_frontend/config/amy_config.json >/dev/null
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/config/amy_config.json \
            amysynth_version/qt_frontend/gui/Main.qml \
            amysynth_version/qt_frontend/tests/test_static_contracts.py \
            amysynth_version/qt_frontend/tests/integration/test_serial.py \
            amysynth_version/qt_frontend/tests/integration/test_native_controls.py \
            amysynth_version/qt_frontend/docs/SEQUENCER_TAGS.md
          git diff --cached --check
          git commit -m 'Isolate AMY musical roles on separate buses'
          git push origin HEAD:feature/reverb-reset-and-control-safety
