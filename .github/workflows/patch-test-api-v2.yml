name: Patch test API v2

on:
  push:
    branches: [ci/qt-amy-integration-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/qt-amy-integration-v2
      - name: Patch and validate main.py
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('amysynth_version/qt_frontend/code/main.py')
          s = p.read_text(encoding='utf-8')

          anchor = 'from amy_serial import AmySerialClient, load_amy_config\n'
          if anchor not in s:
              raise SystemExit('import anchor missing')
          s = s.replace(anchor, anchor + 'from test_control import TestControlServer\n', 1)

          return_anchor = '    return parser.parse_args()\n'
          api_arg = '''    parser.add_argument(
        "--test-api-port",
        type=int,
        default=None,
        help=(
            "Enable localhost-only HTTP test control on this port. "
            "For CI/integration testing only."
        ),
    )
'''
          if return_anchor not in s:
              raise SystemExit('argument anchor missing')
          s = s.replace(return_anchor, api_arg + return_anchor, 1)

          engine_anchor = '    engine = QQmlApplicationEngine()\n'
          server_setup = '''    test_server = None
    if args.test_api_port is not None:
        test_server = TestControlServer(backend, args.test_api_port)
        print(
            f"Test control API: http://127.0.0.1:{test_server.port}",
            file=sys.stderr,
            flush=True,
        )

'''
          if engine_anchor not in s:
              raise SystemExit('engine anchor missing')
          s = s.replace(engine_anchor, server_setup + engine_anchor, 1)

          start = s.index('    if not engine.rootObjects():\n')
          end = s.index('    backend.send_initial_state()\n', start)
          failure_block = '''    if not engine.rootObjects():
        if test_server is not None:
            test_server.close()
        amy_client.close()
        return 1

'''
          s = s[:start] + failure_block + s[end:]

          teardown = '''    # QML can no longer generate performance messages, so stop AMY and close
    # the UART before releasing the backend object that owns the client.
    amy_client.close()
'''
          replacement = '''    # QML can no longer generate performance messages, so stop the test API,
    # then stop AMY and close the UART before releasing the backend object.
    if test_server is not None:
        test_server.close()
    amy_client.close()
'''
          if teardown not in s:
              raise SystemExit('teardown anchor missing')
          s = s.replace(teardown, replacement, 1)

          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit application hook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- amysynth_version/qt_frontend/code/main.py
          git commit -m 'Expose Qt backend test control API'
          git push origin HEAD:ci/qt-amy-integration-v2
