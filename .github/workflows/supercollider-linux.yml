name: Test and build SuperCollider Linux edition

on:
  push:
    branches: [main, version/supercollider]
    paths:
      - 'sc_version/**'
      - '.github/workflows/supercollider-linux.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Publish this tested SuperCollider Linux build
        required: true
        default: false
        type: boolean

concurrency:
  group: supercollider-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      release_stamp: ${{ steps.names.outputs.release_stamp }}
      release_tag: ${{ steps.names.outputs.release_tag }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sc_version/qt_frontend/requirements.txt
            sc_version/qt_frontend/requirements-build.txt
            sc_version/qt_frontend/requirements-test.txt
            sc_version/qt_frontend/packaging/constraints/desktop-current.txt

      - name: Create build names
        id: names
        run: |
          instant="$(date -u +%Y%m%dT%H%M%S)"
          echo "release_stamp=R${instant/T/}" >> "$GITHUB_OUTPUT"
          echo "release_tag=R${instant}-SC" >> "$GITHUB_OUTPUT"

      - name: Install headless SuperCollider build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl libasound2-dev libfftw3-dev \
            libjack-jackd2-dev libreadline-dev libsndfile1-dev ninja-build \
            patchelf
          python -m pip install \
            -c sc_version/qt_frontend/packaging/constraints/desktop-current.txt \
            -r sc_version/qt_frontend/requirements-build.txt \
            -r sc_version/qt_frontend/requirements-test.txt

      - name: Build pinned headless SuperCollider 3.14.1
        env:
          OMNICHORD_SC_BUILD_ROOT: ${{ runner.temp }}/supercollider-build
          OMNICHORD_SC_INSTALL_PREFIX: ${{ runner.temp }}/supercollider-runtime
        run: |
          sc_version/packaging/build_supercollider_runtime.sh
          echo "$RUNNER_TEMP/supercollider-runtime/bin" >> "$GITHUB_PATH"

      - name: Test frontend and engine with the pinned runtime
        run: |
          python sc_version/qt_frontend/tests/run_tests.py --suite quality
          python sc_version/qt_frontend/tests/run_tests.py --suite sc-frontend
          python sc_version/qt_frontend/tests/run_tests.py --suite sc-compiler
          python sc_version/qt_frontend/tests/run_tests.py --suite sc-sequencer
          python sc_version/qt_frontend/tests/run_tests.py --suite sc-audio
          python sc_version/qt_frontend/tests/run_tests.py --suite sc-banks
          python sc_version/qt_frontend/tests/run_tests.py --suite sc-packaged
          python sc_version/qt_frontend/tests/run_tests.py --suite platform-input-linux

      - name: Download verified AppImage tools
        run: |
          curl -L --fail --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimagetool"
          echo 'a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  '${RUNNER_TEMP}'/appimagetool' \
            | sha256sum --check --strict
          curl -L --fail --silent --show-error \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
            -o "$RUNNER_TEMP/appimage-runtime"
          echo '1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf  '${RUNNER_TEMP}'/appimage-runtime' \
            | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build self-contained frontend and SC runtime AppImage
        working-directory: sc_version/qt_frontend
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_RUNTIME_FILE: ${{ runner.temp }}/appimage-runtime
          OMNICHORD_SC_RUNTIME_PREFIX: ${{ runner.temp }}/supercollider-runtime
          OMNICHORD_RELEASE_STAMP: ${{ steps.names.outputs.release_stamp }}
        run: packaging/build_sc_appimage.sh

      - name: Validate the packaged runtime without opening audio
        working-directory: sc_version/qt_frontend
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          package="dist/LB_Omnichord.SC.${{ steps.names.outputs.release_stamp }}.Linux-x86_64.AppImage"
          "$package" --verify-package
          ! "$package" --verify-package 2>&1 | grep -q 'c_amy'
          (cd dist && sha256sum "$(basename "$package")" > "$(basename "$package").sha256")

      - name: Upload tested SC Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-SC-Linux-x86_64
          path: |
            sc_version/qt_frontend/dist/*.AppImage
            sc_version/qt_frontend/dist/*.AppImage.sha256
            sc_version/qt_frontend/dist/*.AppImage.package-audit.json
            sc_version/qt_frontend/dist/*.AppImage.qml-imports.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-SC-Linux-x86_64
          path: dist

      - name: Publish independent SuperCollider release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.linux.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes 'LB Omnichord SuperCollider Linux edition. Install VSCO 2 CE at ~/sample_lib/VSCO-2-CE-1.1.0 before first launch. Android, ESP32-P4, macOS and Windows remain AMY-edition targets.'
