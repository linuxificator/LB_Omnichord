name: Temporary rhythm chord instrument validation

on:
  pull_request:
    paths:
      - 'amysynth_version/qt_frontend/code/amy_serial.py'
      - 'amysynth_version/qt_frontend/tests/test_instrument_defaults.py'
      - '.github/workflows/tmp-rhythm-chord-instrument-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instrument-control-defaults

      - name: Patch live rhythm refresh on chord instrument change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('amysynth_version/qt_frontend/code/amy_serial.py')
          s = p.read_text(encoding='utf-8')

          old = '''        # _configure_synth loads each K patch and immediately follows it with\n        # the complete state above, so returning to a previously edited\n        # instrument cannot leave AMY at its factory slider values.\n        self._configure_synth(role)\n\n        if role == "chord" and self._manual_active_id is not None:\n'''
          new = '''        # _configure_synth loads each K patch and immediately follows it with\n        # the complete state above, so returning to a previously edited\n        # instrument cannot leave AMY at its factory slider values.\n        self._configure_synth(role)\n\n        # Chord has two independent AMY synths: manual_chord and\n        # rhythm_chord. A running sequencer must be refreshed after the\n        # rhythm_chord synth is repatched. Keep the current AMY timebase so\n        # changing sound does not restart the bar or tempo phase.\n        if role == "chord" and getattr(self, "rhythm_running", False):\n            self._rebuild_rhythm(reset_phase=False)\n\n        if role == "chord" and self._manual_active_id is not None:\n'''
          if old not in s:
              raise SystemExit('atomic chord restore anchor missing')
          s = s.replace(old, new, 1)

          old_legacy = '''        self.synth_params[role] = {}\n        self._adsr_override_active[role] = False\n        self._configure_synth(role)\n\n        # A chord patch hot-swap silences both independent chord pools. If a\n'''
          new_legacy = '''        self.synth_params[role] = {}\n        self._adsr_override_active[role] = False\n        self._configure_synth(role)\n\n        if role == "chord" and getattr(self, "rhythm_running", False):\n            self._rebuild_rhythm(reset_phase=False)\n\n        # A chord patch hot-swap silences both independent chord pools. If a\n'''
          if old_legacy not in s:
              raise SystemExit('legacy chord-name anchor missing')
          s = s.replace(old_legacy, new_legacy, 1)

          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('amysynth_version/qt_frontend/tests/test_instrument_defaults.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          tests = '''\n    def test_live_rhythm_rebuilds_without_phase_reset_on_chord_instrument_change(self) -> None:\n        client = object.__new__(AmySerialClient)\n        client.patch_map = {"juno_050": 50}\n        client.selected_synth = {"chord": "juno_000"}\n        client.synth_params = {"chord": {}}\n        client._adsr_override_active = {"chord": False}\n        client.synth_id = {\n            "strum": 2, "manual_chord": 3, "rhythm_chord": 4\n        }\n        client._manual_active_id = None\n        client._manual_active_notes = []\n        client.rhythm_running = True\n\n        calls: list[tuple[str, object]] = []\n        client._configure_synth = lambda role: calls.append(("configure", role))\n        client._rebuild_rhythm = (\n            lambda *, reset_phase: calls.append(("rebuild", reset_phase))\n        )\n\n        AmySerialClient._set_synth_state(\n            client,\n            "chord",\n            {\n                "name": "juno_050",\n                "params": ["resonance", 7.5],\n            },\n        )\n\n        self.assertEqual(\n            calls,\n            [("configure", "chord"), ("rebuild", False)],\n        )\n\n    def test_stopped_rhythm_is_not_rebuilt_on_chord_instrument_change(self) -> None:\n        client = object.__new__(AmySerialClient)\n        client.patch_map = {"juno_050": 50}\n        client.selected_synth = {"chord": "juno_000"}\n        client.synth_params = {"chord": {}}\n        client._adsr_override_active = {"chord": False}\n        client.synth_id = {\n            "strum": 2, "manual_chord": 3, "rhythm_chord": 4\n        }\n        client._manual_active_id = None\n        client._manual_active_notes = []\n        client.rhythm_running = False\n\n        calls: list[tuple[str, object]] = []\n        client._configure_synth = lambda role: calls.append(("configure", role))\n        client._rebuild_rhythm = (\n            lambda *, reset_phase: calls.append(("rebuild", reset_phase))\n        )\n\n        AmySerialClient._set_synth_state(\n            client,\n            "chord",\n            {"name": "juno_050", "params": ["resonance", 7.5]},\n        )\n\n        self.assertEqual(calls, [("configure", "chord")])\n'''
          if 'test_live_rhythm_rebuilds_without_phase_reset_on_chord_instrument_change' not in s:
              if anchor not in s:
                  raise SystemExit('test end anchor missing')
              s = s.replace(anchor, '\n' + tests + anchor, 1)
          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install minimal PySide runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amysynth_version/qt_frontend/requirements.txt

      - name: Install frontend dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -r requirements.txt

      - name: Run instrument tests
        working-directory: amysynth_version/qt_frontend
        run: python tests/test_instrument_defaults.py

      - name: Verify syntax
        run: |
          python -m py_compile \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/tests/test_instrument_defaults.py

      - name: Commit tested fix
        run: |
          if git diff --quiet -- \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/tests/test_instrument_defaults.py; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            amysynth_version/qt_frontend/code/amy_serial.py \
            amysynth_version/qt_frontend/tests/test_instrument_defaults.py
          git commit -m 'Refresh live rhythm chord instrument'
          git push origin HEAD:feature/instrument-control-defaults
