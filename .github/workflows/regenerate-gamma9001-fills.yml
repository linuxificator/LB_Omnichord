name: Regenerate Gamma9001-aligned drum fills

on:
  push:
    branches:
      - feature/gamma9001-drum-pattern-refresh
    paths:
      - '.github/workflows/regenerate-gamma9001-fills.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/gamma9001-drum-pattern-refresh
          fetch-depth: 1

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            amysynth_version/qt_frontend/requirements.txt
            amysynth_version/qt_frontend/requirements-portable.txt
            amysynth_version/qt_frontend/requirements-test.txt
            amysynth_version/qt_frontend/packaging/constraints/desktop-current.txt

      - name: Generate canonical fills
        run: python amysynth_version/design/rhythm_rework/new_patterns/regenerate_gamma9001_fills.py --generate

      - name: Restore musical start-position rotation
        run: python amysynth_version/design/rhythm_rework/new_patterns/adjust_gamma9001_fill_starts.py --adjust

      - name: Install exact frontend test dependencies
        working-directory: amysynth_version/qt_frontend
        run: python -m pip install -c packaging/constraints/desktop-current.txt -r requirements-test.txt

      - name: Run focused fill regressions
        working-directory: amysynth_version/qt_frontend
        run: |
          python tests/test_drum_patterns.py
          python tests/test_catalogue_provenance.py
          python tests/test_sequencer_tags.py

      - name: Run maintained unit suite
        working-directory: amysynth_version/qt_frontend
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/amysynth_version/qt_frontend/tests/alsa-null.conf
          OMNICHORD_TEST_ARTIFACT_DIR: test-artifacts
        run: python tests/run_tests.py --suite unit --coverage

      - name: Write validated Codex handover
        run: python amysynth_version/design/rhythm_rework/new_patterns/adjust_gamma9001_fill_starts.py --handover

      - name: Remove temporary regeneration machinery
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/materialize-gamma9001-drum-refresh.yml \
            .github/workflows/finalize-gamma9001-drum-refresh.yml \
            .github/workflows/regenerate-gamma9001-fills.yml \
            amysynth_version/design/rhythm_rework/new_patterns/materialize_gamma9001_drum_refresh.py \
            amysynth_version/design/rhythm_rework/new_patterns/regenerate_gamma9001_fills.py \
            amysynth_version/design/rhythm_rework/new_patterns/adjust_gamma9001_fill_starts.py \
            amysynth_version/design/rhythm_rework/new_patterns/drum_activity_timing.refresh.json.gz.b64.part1 \
            amysynth_version/design/rhythm_rework/new_patterns/drum_activity_timing.refresh.json.gz.b64.part2 \
            amysynth_version/design/rhythm_rework/new_patterns/drum_activity_timing.refresh.json.gz.b64.part3 \
            amysynth_version/design/rhythm_rework/new_patterns/drum_activity_timing.refresh.json.gz.b64.part4

      - name: Commit regenerated fill catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            amysynth_version/qt_frontend/music/drums/drum_fills_timing.json \
            amysynth_version/qt_frontend/music/drums/drum_fill_continuation_roles.json \
            amysynth_version/qt_frontend/music/drums/drum_fills_instruments_gamma9001.json \
            amysynth_version/qt_frontend/music/drums/drum_fills_instruments_tiny.json \
            amysynth_version/qt_frontend/music/drums/drum_fills_instruments_general_midi.json \
            amysynth_version/qt_frontend/music/catalogue_provenance.json \
            amysynth_version/qt_frontend/tests/test_drum_patterns.py \
            amysynth_version/design/rhythm_rework/new_patterns/canonical_drum_data_manifest.json \
            amysynth_version/design/rhythm_rework/new_patterns/CODEX_HANDOVER_GAMMA9001_FILL_REFRESH.md
          git diff --cached --check
          git commit -m 'Regenerate Gamma9001-aligned drum fills'
          git push origin HEAD:feature/gamma9001-drum-pattern-refresh
