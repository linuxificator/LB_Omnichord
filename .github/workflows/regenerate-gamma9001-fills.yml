        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('amysynth_version')
          drums = root / 'qt_frontend/music/drums'
          out = root / 'design/rhythm_rework/new_patterns/CODEX_HANDOVER_GAMMA9001_FILL_REFRESH.md'
          hashes = {
              name: hashlib.sha256((drums / name).read_bytes()).hexdigest()
              for name in (
                  'drum_fills_timing.json',
                  'drum_fill_continuation_roles.json',
