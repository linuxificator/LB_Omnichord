                  'drum_fills_instruments_tiny.json',
                  'drum_fills_instruments_general_midi.json',
              )
          }
          content = f'''# Codex handover — Gamma9001-first drum fill refresh

Status: **canonical fill data regenerated against the refreshed drum grooves and validated**

Repository: `linuxificator/LB_Omnichord`  
Branch: `feature/gamma9001-drum-pattern-refresh`  
Active implementation: `amysynth_version` only. Sonic Pi remains frozen.

## Intent

The previous 270 fills were authored against the older drum activity catalogue and no longer sat naturally inside the richer Gamma9001-first grooves. This change replaces fill timing/continuation policy while preserving the existing five-F-button behavior, wire-only frontend architecture and nested AMY sequencer implementation.

## Hard architecture rules

- `drum_activity_timing.json` remains the authority for repeating groove timing.
- `drum_fills_timing.json` contains only kit-independent tick/role/velocity fill data.
- Concrete sounds remain in the three fill instrument realization files.
- Gamma9001 is the musical quality reference.
- Tiny exists for compatibility/tests only; its missing colour is accepted degradation and must never reduce the authored Gamma9001 vocabulary.
- Fill realization uses the same per-rhythm profile assignment as the corresponding base groove for every kit family.
- Do not move musical fill policy into AMY. AMY owns generic nested-sequencer mechanics only.

## Musical construction

All 54 rhythms still have exactly five fills (270 total). Each fill starts from the final matching window of the current **level-3 refreshed groove**, retaining essential non-continuing groove anchors, then overlays genre-specific transition vocabulary.

Examples of deliberate continuation policy:

- house/disco/techno/trance: four-on-the-floor kick continues; short fills can also retain the main timekeeper;
- jazz: ride/foot timekeeping can continue under short fills;
- Latin: clave/timeline and shaker continue where appropriate, with bossa/samba/cumbia/soca also able to retain the low pulse;
- ordinary pop/rock/funk fills generally replace more of the groove, with only short fills optionally retaining timekeeping.

Every allowed start is chosen so `start + duration` ends exactly at the written bar boundary. The next bar's normal groove owns the resolving downbeat; fills do not fake a crash beyond their duration.

## Gamma9001 use

The existing Gamma9001 profiles already expose TR-808, TR-909, Linn 9000, Tokyo Synthetics, 80s Power Kit and patch-390 percussion. The refreshed fills actively use logical tom, open-hat, electronic-detail, side-stick, hand-percussion, cowbell/accent and timbale/conga roles where stylistically appropriate. Latin profiles therefore retain the full patch-390 colour. Tiny resolves the same logical roles through surrogates only.

## Validation

The regeneration passed:

- `python tests/test_drum_patterns.py`;
- `python tests/test_catalogue_provenance.py`;
- `python tests/test_sequencer_tags.py`;
- `python tests/run_tests.py --suite unit --coverage` in the same pinned Python/Qt dependency environment used by project CI.

A permanent regression now asserts that every allowed fill start resolves exactly at a bar boundary and that fill/profile selection equals base-groove/profile selection for all three kit families.

## Canonical hashes

- `drum_fills_timing.json`: `{hashes['drum_fills_timing.json']}`
- `drum_fill_continuation_roles.json`: `{hashes['drum_fill_continuation_roles.json']}`
- `drum_fills_instruments_gamma9001.json`: `{hashes['drum_fills_instruments_gamma9001.json']}`
- `drum_fills_instruments_tiny.json`: `{hashes['drum_fills_instruments_tiny.json']}`
- `drum_fills_instruments_general_midi.json`: `{hashes['drum_fills_instruments_general_midi.json']}`

## Do not regress

Do not re-author fills around Tiny limitations. Do not concatenate activity levels. Do not add autonomous fills to activity level 5. Do not use host timers as a musical clock. Do not reset transport or sequencer phase to launch or edit fills.
'''
          out.write_text(content, encoding='utf-8')
          PY

