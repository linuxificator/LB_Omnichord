          from pathlib import Path

          p = Path('amysynth_version/qt_frontend/tests/test_drum_patterns.py')
          text = p.read_text(encoding='utf-8')
          marker = '    def test_fill_sequences_preserve_events_and_only_add_generic_gates(self) -> None:\n'
          method = '''    def test_fills_end_on_bar_boundary_and_use_base_groove_profiles(self) -> None:\n        for rhythm in self.catalog.rhythms.values():\n            numerator = int(rhythm.meter.split("/", 1)[0])\n            bar_ticks = numerator * rhythm.fills[0].beat_unit_ticks\n            for fill in rhythm.fills:\n                for start in fill.allowed_start_beats:\n                    self.assertEqual(\n                        (start - 1) * fill.beat_unit_ticks + fill.duration_ticks,\n                        bar_ticks,\n                        fill.fill_id,\n                    )\n        for kit_name in KIT_FAMILIES:\n            kit = self.catalog.kits[kit_name]\n            self.assertEqual(\n                dict(kit.fill_rhythm_profile),\n                dict(kit.activity_rhythm_profile),\n                kit_name,\n            )\n\n'''
          if 'def test_fills_end_on_bar_boundary_and_use_base_groove_profiles' not in text:
              if marker not in text:
                  raise SystemExit('fill regression insertion marker not found')
              p.write_text(text.replace(marker, method + marker, 1), encoding='utf-8')
