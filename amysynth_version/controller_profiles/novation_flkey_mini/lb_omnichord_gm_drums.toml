version = 2
device = "flkey-mini-pads"
name = "LB GM Drums"

# All pads turn white while pressed. Idle colors group cymbals/hi-hats
# (yellow), toms (green), snare/auxiliary sounds (red/orange), and kicks (blue).
active-color = 3

# Upper row, left to right: higher kit voices. The two crashes occupy the
# outside edges, with hi-hats, rack toms and ride between them.
[pads.1]
color = 13
[pads.1.note]
pitch = 49 # Crash Cymbal 1
channel = 10

[pads.2]
color = 13
[pads.2.note]
pitch = 42 # Closed Hi-Hat
channel = 10

[pads.3]
color = 13
[pads.3.note]
pitch = 44 # Pedal Hi-Hat
channel = 10

[pads.4]
color = 13
[pads.4.note]
pitch = 46 # Open Hi-Hat
channel = 10

[pads.5]
color = 21
[pads.5.note]
pitch = 50 # High Tom
channel = 10

[pads.6]
color = 21
[pads.6.note]
pitch = 48 # Hi-Mid Tom
channel = 10

[pads.7]
color = 13
[pads.7.note]
pitch = 51 # Ride Cymbal 1
channel = 10

[pads.8]
color = 13
[pads.8.note]
pitch = 57 # Crash Cymbal 2
channel = 10

# Lower row, left to right: auxiliary/snare voices on the left, the two bass
